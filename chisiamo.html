<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Sicuro | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Stripe SDK -->
    <script src="https://js.stripe.com/v3/"></script>
    <!-- PayPal SDK (Sostituisci 'test' con il tuo Client ID live quando sei pronto) -->
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=EUR"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-gray-800/85">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-10 sm:h-12 object-contain" onerror="this.src='logo.svg'">
            </a>
            <a href="catalog.html" class="text-xs font-mono text-gray-400 hover:text-white">← Torna al Catalogo</a>
        </div>
    </header>

    <!-- CONTENUTO CHECKOUT -->
    <main class="py-12 px-4 sm:px-6 max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-8 flex-grow">
        
        <!-- SEZIONE DATI E PAGAMENTO -->
        <div class="bg-dark-card border border-gray-800 p-6 sm:p-8 rounded-2xl space-y-6 shadow-xl">
            <h1 class="text-xl font-bold text-white tracking-tight">Dati di Spedizione & Pagamento</h1>
            
            <form id="checkout-form" class="space-y-4 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Nome e Cognome *</label>
                    <input type="text" id="cust-name" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Email per Ricevuta/Fattura *</label>
                    <input type="email" id="cust-email" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Indirizzo di Spedizione *</label>
                    <input type="text" id="cust-address" required placeholder="Via, Città, CAP" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>

                <!-- SCELTA METODO DI PAGAMENTO -->
                <div class="pt-4 space-y-3">
                    <label class="block text-gray-300 font-bold font-mono">Seleziona Metodo di Pagamento:</label>
                    
                    <label class="flex items-center gap-3 p-3 bg-dark-bg border border-gray-800 rounded-xl cursor-pointer hover:border-brand-500/50">
                        <input type="radio" name="payment_method" value="stripe" checked onclick="togglePaymentMethod('stripe')" class="text-brand-500 focus:ring-brand-500">
                        <span class="font-bold text-white">Carta di Credito / Debito (Stripe)</span>
                    </label>

                    <label class="flex items-center gap-3 p-3 bg-dark-bg border border-gray-800 rounded-xl cursor-pointer hover:border-brand-500/50">
                        <input type="radio" name="payment_method" value="paypal" onclick="togglePaymentMethod('paypal')" class="text-brand-500 focus:ring-brand-500">
                        <span class="font-bold text-white">PayPal</span>
                    </label>
                </div>

                <!-- CONTENITORE PULSANTE STRIPE -->
                <div id="stripe-container" class="pt-4">
                    <button type="submit" id="stripe-pay-btn" class="w-full py-4 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg cursor-pointer">
                        Paga con Carta (Stripe)
                    </button>
                </div>

                <!-- CONTENITORE PULSANTE PAYPAL (Visibile se selezionato PayPal) -->
                <div id="paypal-button-container" class="hidden pt-4"></div>
            </form>
        </div>

        <!-- RIEPILOGO CARRELLO -->
        <div class="bg-dark-card border border-gray-800 p-6 sm:p-8 rounded-2xl space-y-6 shadow-xl h-fit">
            <h2 class="text-lg font-bold text-white tracking-tight border-b border-gray-800 pb-4">Riepilogo Ordine</h2>
            <div id="checkout-items-list" class="space-y-3 font-mono text-xs max-h-60 overflow-y-auto"></div>
            <div class="border-t border-gray-800 pt-4 flex justify-between items-center font-bold text-sm">
                <span>Totale da Pagare:</span>
                <span id="checkout-total" class="text-brand-400">€0.00</span>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#05080e] border-t border-gray-800/80 py-6 text-xs text-gray-500 text-center font-mono">
        LS3DMAKER © 2026 - Transazioni Protette
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('ls3d_cart')) || [];

        function renderCheckoutSummary() {
            const container = document.getElementById('checkout-items-list');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500">Il carrello è vuoto.</p>";
                document.getElementById('checkout-total').innerText = "€0.00";
                return 0;
            }

            let total = 0;
            container.innerHTML = cart.map(i => {
                total += i.price * i.qty;
                return `
                    <div class="flex justify-between items-center bg-dark-bg p-3 rounded-xl border border-gray-800">
                        <div>
                            <p class="font-bold text-white">${i.qty}x ${i.title}</p>
                            <p class="text-[10px] text-gray-400">Colore: <span class="text-brand-400">${i.color}</span></p>
                        </div>
                        <span class="font-bold text-brand-400">€${(i.price * i.qty).toFixed(2)}</span>
                    </div>
                `;
            }).join('');
            document.getElementById('checkout-total').innerText = `€${total.toFixed(2)}`;
            return total;
        }

        function togglePaymentMethod(method) {
            const stripeBtn = document.getElementById('stripe-container');
            const paypalContainer = document.getElementById('paypal-button-container');

            if (method === 'paypal') {
                stripeBtn.classList.add('hidden');
                paypalContainer.classList.remove('hidden');
                initPayPalButton();
            } else {
                paypalContainer.classList.add('hidden');
                stripeBtn.classList.remove('hidden');
            }
        }

        // --- CONTROLLO ED ESECUZIONE PAGAMENTO STRIPE ---
        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const total = renderCheckoutSummary();
            if (cart.length === 0) { alert("Il carrello è vuoto."); return; }

            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;

            // NOTA: Qui inserisci la chiamata Stripe reale (es. stripe.confirmPayment).
            // Se la transazione va a buon fine (status succeeded), scatta il salvataggio.
            let paymentVerified = true; // Simulazione esito positivo Stripe

            if (paymentVerified) {
                finalizeOrderAndSave("Stripe", "STRIPE-" + Date.now(), name, email, total);
            } else {
                alert("Pagamento con carta non autorizzato. Ordine non registrato.");
            }
        });

        // --- CONTROLLO ED ESECUZIONE PAGAMENTO PAYPAL ---
        function initPayPalButton() {
            const container = document.getElementById('paypal-button-container');
            container.innerHTML = ""; // Pulisce il contenitore
            
            const total = renderCheckoutSummary();
            if (total <= 0) return;

            paypal.Buttons({
                createOrder: function(data, actions) {
                    return actions.order.create({
                        purchase_units: [{ amount: { value: total.toFixed(2) } }]
                    });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        // IL PAGAMENTO È STATO AUTORIZZATO E INCASSATO DA PAYPAL
                        const name = document.getElementById('cust-name').value || details.payer.name.given_name;
                        const email = document.getElementById('cust-email').value || details.payer.email_address;
                        
                        finalizeOrderAndSave("PayPal", details.id, name, email, total);
                    });
                },
                onError: function(err) {
                    alert("Errore durante il pagamento PayPal. L'ordine non è stato registrato.");
                }
            }).render('#paypal-button-container');
        }

        // --- FUNZIONE DI SALVATAGGIO BLINDATO (Registra ordine e svuota carrello SOLO ORA) ---
        function finalizeOrderAndSave(gateway, transactionId, name, email, total) {
            const newOrder = {
                id: "ORD-" + Date.now(),
                number: "2026/" + Math.floor(Math.random() * 1000),
                gateway: gateway,
                transactionId: transactionId,
                name: name,
                email: email,
                date: new Date().toISOString(),
                items: cart,
                total: total
            };

            // Salva nel pannello Admin (ls3d_orders)
            let orders = JSON.parse(localStorage.getItem('ls3d_orders')) || [];
            orders.push(newOrder);
            localStorage.setItem('ls3d_orders', JSON.stringify(orders));

            // Svuota il carrello solo a conferma avvenuta
            localStorage.removeItem('ls3d_cart');

            alert(`Pagamento andato a buon fine tramite ${gateway}! Ordine registrato correttamente.`);
            window.location.href = "index.html";
        }

        renderCheckoutSummary();
        lucide.createIcons();
    </script>
</body>
</html>
