<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Prodotti | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <!-- HEADER / NAV -->
    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-gray-800/85">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-10 sm:h-12 object-contain" onerror="this.src='logo.svg'">
            </a>
            
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-xs font-mono text-gray-400 hover:text-white transition-colors">Home</a>
                <!-- TASTO APERTURA CARRELLO -->
                <button onclick="toggleCartModal()" class="relative bg-dark-surface border border-gray-800 p-3 rounded-xl hover:border-brand-500/50 transition-colors cursor-pointer flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="w-5 h-5 text-brand-400"></i>
                    <span id="cart-counter" class="absolute -top-2 -right-2 bg-brand-500 text-black font-mono font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE CATALOGO -->
    <main class="py-12 px-4 sm:px-6 max-w-7xl mx-auto w-full flex-grow space-y-8">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Catalogo 3D</h1>
                <p class="text-xs font-mono text-gray-400 mt-1">Scegli tra i nostri modelli stampati in alta definizione.</p>
            </div>
        </div>

        <!-- GRIGLIA PRODOTTI DINAMICA -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- I prodotti vengono caricati dinamicamente via JS -->
        </div>

    </main>

    <!-- MODALE CARRELLO LATORE / OVERLAY -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-dark-card border-l border-gray-800 w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl">
            <div class="space-y-6">
                <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                    <h2 class="text-base font-bold text-white flex items-center gap-2 font-mono">
                        <i data-lucide="shopping-cart" class="w-4 h-4 text-brand-400"></i> Il tuo Carrello
                    </h2>
                    <button onclick="toggleCartModal()" class="text-gray-400 hover:text-white cursor-pointer">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- LISTA ARTICOLI NEL CARRELLO -->
                <div id="cart-items-container" class="space-y-3 font-mono text-xs max-h-[50vh] overflow-y-auto pr-1">
                    <!-- Dinamico -->
                </div>
            </div>

            <!-- FOOTER MODALE CARRELLO -->
            <div class="border-t border-gray-800 pt-4 space-y-4">
                <div class="flex justify-between items-center font-bold text-sm">
                    <span>Totale:</span>
                    <span id="cart-modal-total" class="text-brand-400">€0.00</span>
                </div>
                <button onclick="goToCheckout()" class="w-full py-4 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    Procedi al Checkout Sicuro <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-[#05080e] border-t border-gray-800/80 py-8 text-xs text-gray-500 text-center font-mono">
        LS3DMAKER © 2026 - Tutti i diritti riservati
    </footer>

    <!-- SCRIPT LOGICA CATALOGO E CARRELLO -->
    <script>
        // Carica prodotti da localStorage (gestiti dal pannello Admin)
        function getProducts() {
            try {
                const saved = localStorage.getItem('ls3d_products');
                if (saved) return JSON.parse(saved);
            } catch (e) { console.error(e); }
            
            // Prodotti di fallback se il localStorage è vuoto
            return [
                { id: 1, title: "Supporto Cuffie Premium", price: 24.99, oldPrice: 29.99, desc: "Supporto ergonomico stampato in PLA rinforzato.", image: "https://images.unsplash.com/photo-1584679109597-c651b16c62db?auto=format&fit=crop&q=80&w=600", colors: ["Nero Opaco", "Grigio Titanio", "Bianco Perla"] },
                { id: 2, title: "Organizzatore Scrivania Modulare", price: 19.50, oldPrice: 0, desc: "Sistema componibile per penne, smartphone e accessori.", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=600", colors: ["Nero", "Verde Foresta", "Legno PLA"] }
            ];
        }

        let cart = [];
        try { cart = JSON.parse(localStorage.getItem('ls3d_cart')) || []; } catch (e) { cart = []; }

        function renderCatalog() {
            const grid = document.getElementById('products-grid');
            if (!grid) return;

            const products = getProducts();
            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 font-mono py-12">Nessun prodotto disponibile al momento.</p>`;
                return;
            }

            grid.innerHTML = products.map((p, idx) => {
                const colors = p.colors || ["Standard"];
                const colorOptions = colors.map(c => `<option value="${c}">${c}</option>`).join('');
                
                const currentPrice = Number(p.price) || 0;
                const oldPrice = Number(p.oldPrice) || 0;
                const hasDiscount = oldPrice > currentPrice;

                let priceHtml = `<span class="font-mono font-bold text-brand-400 text-sm">€${currentPrice.toFixed(2)}</span>`;
                if (hasDiscount) {
                    priceHtml = `
                        <div class="flex items-center gap-2">
                            <span class="font-mono font-bold text-brand-400 text-sm">€${currentPrice.toFixed(2)}</span>
                            <span class="font-mono text-gray-500 text-xs line-through">€${oldPrice.toFixed(2)}</span>
                        </div>
                    `;
                }

                return `
                    <div class="bg-dark-card border border-gray-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between group hover:border-gray-700 transition-all">
                        <div>
                            <div class="h-48 overflow-hidden bg-dark-bg relative">
                                <img src="${p.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=600'}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=600'">
                                ${hasDiscount ? '<span class="absolute top-3 left-3 bg-red-500 text-black font-mono font-bold text-[10px] px-2 py-1 rounded-lg uppercase tracking-wider shadow-md">Promo</span>' : ''}
                            </div>
                            <div class="p-5 space-y-3">
                                <h3 class="font-bold text-white text-base">${p.title}</h3>
                                <p class="text-xs text-gray-400 leading-relaxed line-clamp-2">${p.desc || 'Prodotto 3D di alta qualità.'}</p>
                                
                                <div class="space-y-1 pt-2 font-mono text-[11px]">
                                    <label class="text-gray-400">Colore:</label>
                                    <select id="color-${idx}" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-2 text-white focus:border-brand-500 focus:outline-none">
                                        ${colorOptions}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="p-5 pt-0 flex items-center justify-between border-t border-gray-800/60 mt-4">
                            <div>${priceHtml}</div>
                            <button onclick="addToCart('${p.title.replace(/'/g, "\\'")}', ${currentPrice}, 'color-${idx}')" class="px-4 py-2.5 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-md flex items-center gap-2 cursor-pointer">
                                <i data-lucide="plus" class="w-4 h-4"></i> Aggiungi
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            try { lucide.createIcons(); } catch(e){}
        }

        function addToCart(title, price, colorSelectId) {
            const colorSelect = document.getElementById(colorSelectId);
            const selectedColor = colorSelect ? colorSelect.value : 'Standard';

            const existingIndex = cart.findIndex(i => i.title === title && i.color === selectedColor);
            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({ title, price, color: selectedColor, qty: 1 });
            }

            saveCart();
            updateCartUI();
            toggleCartModal();
        }

        function updateCartUI() {
            const counter = document.getElementById('cart-counter');
            const container = document.getElementById('cart-items-container');
            const totalModal = document.getElementById('cart-modal-total');

            let totalQty = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                if (container) container.innerHTML = `<p class="text-gray-500 text-center py-6">Il carrello è vuoto.</p>`;
                if (totalModal) totalModal.innerText = "€0.00";
                if (counter) counter.innerText = "0";
                return;
            }

            if (container) {
                container.innerHTML = cart.map((item, index) => {
                    totalQty += item.qty;
                    const itemTotal = item.price * item.qty;
                    totalPrice += itemTotal;

                    return `
                        <div class="flex justify-between items-center bg-dark-bg p-3 rounded-xl border border-gray-800">
                            <div>
                                <p class="font-bold text-white">${item.qty}x ${item.title}</p>
                                <p class="text-[10px] text-gray-400">Colore: <span class="text-brand-400">${item.color}</span></p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-brand-400">€${itemTotal.toFixed(2)}</span>
                                <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-300 cursor-pointer">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (counter) counter.innerText = totalQty;
            if (totalModal) totalModal.innerText = `€${totalPrice.toFixed(2)}`;
            try { lucide.createIcons(); } catch(e){}
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartUI();
        }

        function saveCart() {
            try {
                localStorage.setItem('ls3d_cart', JSON.stringify(cart));
            } catch (e) { console.error(e); }
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            if (modal) modal.classList.toggle('hidden');
        }

        function goToCheckout() {
            if (cart.length === 0) {
                alert("Il carrello è vuoto. Aggiungi almeno un prodotto.");
                return;
            }
            window.location.href = "checkout.html";
        }

        // Inizializzazione al caricamento
        renderCatalog();
        updateCartUI();
    </script>
</body>
</html>
