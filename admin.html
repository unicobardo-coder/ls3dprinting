<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen p-4 sm:p-8 flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <!-- LOGIN SECTION -->
    <div id="login-section" class="max-w-md mx-auto my-auto w-full bg-dark-card border border-brand-500/30 p-8 rounded-2xl space-y-6 shadow-2xl backdrop-blur-md">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-white tracking-tight">Admin Restricted Area</h1>
            <p class="text-xs text-gray-400">Enter password to manage products and filament colors.</p>
        </div>
        <form onsubmit="checkPassword(event)" class="space-y-4 text-xs">
            <div>
                <input type="password" id="admin-pass" required placeholder="Admin Password" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg shadow-brand-500/10">Access Dashboard</button>
            <a href="index.html" class="block text-center text-gray-400 hover:text-white pt-2 transition-colors">← Back to Website</a>
        </form>
    </div>

    <!-- DASHBOARD ADMIN -->
    <div id="admin-dashboard" class="max-w-4xl mx-auto space-y-6 w-full hidden">
        <div class="flex justify-between items-center bg-dark-card border border-brand-500/30 p-6 rounded-2xl shadow-2xl backdrop-blur-md">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Admin Control Panel</h1>
                <p class="text-xs text-gray-400">Manage 3D printing products, pricing, and available filament colors.</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="logoutAdmin()" class="px-4 py-2 bg-red-500/20 text-red-400 rounded-xl text-xs font-mono border border-red-500/30 hover:bg-red-500/30 transition-colors">Logout</button>
                <a href="index.html" class="px-4 py-2 bg-dark-surface hover:bg-gray-800 text-gray-300 rounded-xl text-xs font-mono border border-gray-700 transition-colors">← View Site</a>
            </div>
        </div>

        <div class="bg-dark-card border border-brand-500/30 p-6 rounded-2xl space-y-4 shadow-2xl backdrop-blur-md">
            <h2 id="form-title" class="text-lg font-bold text-white">Add New Product</h2>
            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4 text-xs">
                <input type="hidden" id="prod-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1 font-mono">Product Name *</label>
                        <input type="text" id="prod-title" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-mono">Price (€) *</label>
                        <input type="number" step="0.01" id="prod-price" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Image URL</label>
                    <input type="text" id="prod-image" placeholder="https://..." class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Short Description</label>
                    <input type="text" id="prod-shortdesc" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Available Colors (comma separated)</label>
                    <input type="text" id="prod-colors" placeholder="Matt Black, Pearl White, Techno Grey" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 py-3 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg shadow-brand-500/10">Save Product</button>
                    <button type="button" onclick="resetForm()" class="px-4 py-3 bg-dark-surface text-gray-300 rounded-xl text-xs hover:bg-gray-800 transition-colors">Cancel</button>
                </div>
            </form>
        </div>

        <div class="bg-dark-card border border-brand-500/30 p-6 rounded-2xl space-y-4 shadow-2xl backdrop-blur-md">
            <h2 class="text-lg font-bold text-white">Current Catalog</h2>
            <div id="admin-products-list" class="space-y-3"></div>
        </div>
    </div>

    <footer class="text-center py-6 text-xs text-gray-600 font-mono">
        LS3DMAKER Admin Panel © 2026
    </footer>

    <script>
        const ADMIN_PASSWORD = "tua_password_sicura";
        const defaultImg = "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=80";
        
        let products = JSON.parse(localStorage.getItem('ls3d_products')) || [
            { id: 1, title: "Fermalibri Cyber Geometry", price: 34.90, shortDesc: "Futuristic geometric design.", colors: ["Matt Black", "Pearl White"], images: [defaultImg], hidden: false }
        ];

        if (sessionStorage.getItem('ls3d_auth') === 'true') {
            showAdminDashboard();
        }

        function checkPassword(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem('ls3d_auth', 'true');
                showAdminDashboard();
            } else {
                alert("Incorrect password!");
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('ls3d_auth');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('admin-pass').value = '';
        }

        function showAdminDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            renderAdminProducts();
        }

        function renderAdminProducts() {
            const container = document.getElementById('admin-products-list');
            if (products.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-xs font-mono">No products in catalog.</p>`;
                return;
            }

            container.innerHTML = products.map((p, idx) => `
                <div class="flex justify-between items-center p-4 bg-dark-bg rounded-xl border border-gray-800 text-xs">
                    <div class="flex items-center gap-3">
                        <img src="${p.images?.[0] || defaultImg}" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <p class="font-bold text-white text-sm">${p.title}</p>
                            <p class="text-brand-400 font-mono">€${p.price.toFixed(2)} | Colors: ${(p.colors || ["Standard"]).join(', ')}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="editProduct(${p.id})" class="px-3 py-1.5 bg-dark-surface hover:bg-gray-800 text-white rounded-lg transition-colors">Edit</button>
                        <button onclick="deleteProduct(${p.id})" class="px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg transition-colors">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function saveProduct(e) {
            e.preventDefault();
            const idInput = document.getElementById('prod-id').value;
            const title = document.getElementById('prod-title').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const image = document.getElementById('prod-image').value.trim() || defaultImg;
            const shortDesc = document.getElementById('prod-shortdesc').value;
            
            const colorsRaw = document.getElementById('prod-colors').value;
            const colors = colorsRaw ? colorsRaw.split(',').map(c => c.trim()).filter(c => c.length > 0) : ["Standard"];

            if (idInput) {
                const p = products.find(item => item.id == idInput);
                if (p) {
                    p.title = title;
                    p.price = price;
                    p.images = [image];
                    p.shortDesc = shortDesc;
                    p.colors = colors;
                }
            } else {
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({
                    id: newId,
                    title,
                    price,
                    images: [image],
                    shortDesc,
                    colors,
                    hidden: false
                });
            }

            localStorage.setItem('ls3d_products', JSON.stringify(products));
            resetForm();
            renderAdminProducts();
        }

        function editProduct(id) {
            const p = products.find(item => item.id === id);
            if (!p) return;
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-title').value = p.title;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-image').value = p.images?.[0] || '';
            document.getElementById('prod-shortdesc').value = p.shortDesc || '';
            document.getElementById('prod-colors').value = (p.colors || []).join(', ');
            document.getElementById('form-title').innerText = "Edit Product";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                products = products.filter(item => item.id !== id);
                localStorage.setItem('ls3d_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        function resetForm() {
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('form-title').innerText = "Add New Product";
        }
    </script>
</body>
</html>
