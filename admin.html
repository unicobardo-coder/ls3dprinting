<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Prodotti | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="config.js"></script>
    <script src="mailer.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-gray-800/85">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-10 sm:h-12 object-contain" onerror="this.src='logo.svg'">
            </a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-xs font-mono text-gray-400 hover:text-white transition-colors">Home</a>
                <button onclick="toggleCartModal()" class="relative bg-dark-surface border border-gray-800 p-3 rounded-xl hover:border-brand-500/50 transition-colors cursor-pointer flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="w-5 h-5 text-brand-400"></i>
                    <span id="cart-counter" class="absolute -top-2 -right-2 bg-brand-500 text-black font-mono font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="py-12 px-4 sm:px-6 max-w-7xl mx-auto w-full flex-grow space-y-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Catalogo 3D</h1>
                <p class="text-xs font-mono text-gray-400 mt-1">Scegli tra i nostri modelli stampati in alta definizione e visualizzane l'anteprima 3D.</p>
            </div>
        </div>

        <div id="category-filters" class="flex flex-wrap gap-2 font-mono text-xs"></div>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- CARRELLO MODALE -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-dark-card border-l border-gray-800 w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl">
            <div class="space-y-6">
                <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                    <h2 class="text-base font-bold text-white flex items-center gap-2 font-mono">
                        <i data-lucide="shopping-cart" class="w-4 h-4 text-brand-400"></i> Il tuo Carrello
                    </h2>
                    <button onclick="toggleCartModal()" class="text-gray-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div id="cart-items-container" class="space-y-3 font-mono text-xs max-h-[50vh] overflow-y-auto pr-1"></div>
            </div>
            <div class="border-t border-gray-800 pt-4 space-y-4">
                <div class="flex flex-col gap-1 font-mono text-xs text-gray-400 pb-2 border-b border-gray-800">
                    <div class="flex justify-between"><span>Spedizione combinata:</span> <span class="text-brand-400">+€2.00 per articolo extra</span></div>
                </div>
                <div class="flex justify-between items-center font-bold text-sm">
                    <span>Totale (incl. spedizione):</span>
                    <span id="cart-modal-total" class="text-brand-400">€0.00</span>
                </div>
                <button onclick="goToCheckout()" class="w-full py-4 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    Procedi al Checkout Sicuro <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODALE PRODOTTO & RICHIEDI INFO -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-gray-800 w-full max-w-3xl rounded-2xl p-6 space-y-6 shadow-2xl max-h-[90vh] overflow-y-auto" id="product-modal-content"></div>
    </div>

    <footer class="bg-[#05080e] border-t border-gray-800/80 py-8 text-xs text-gray-500 text-center font-mono">
        LS3DMAKER © 2026 - Tutti i diritti riservati
    </footer>

    <script>
        const lsSb = window.supabase.createClient('https://afpurqovvtaexqvcptqm.supabase.co', 'sb_publishable_qiJxli3f8Lm9D36F1SWbsQ_3l2zV8y9');
        let productsCache = [], reviewsCache = [], categoriesCache = [];
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function mapProduct(r) {
            return { 
                id: r.id, title: r.title, categories: r.categories || [], category: (r.categories || [])[0],
                price: Number(r.price), salePrice: r.sale_price === null ? null : Number(r.sale_price),
                shipping: Number(r.shipping), shortDesc: r.short_desc, longDesc: r.long_desc,
                images: r.images || [], mainImageIndex: r.main_image_index || 0, colors: r.colors || [],
                featured: r.featured, combinedShipping: r.combined_shipping !== false,
                stlFileName: r.stl_file_name, stlUrl: r.stl_url 
            };
        }
        function mapReview(x) { return { id: x.id, productId: x.product_id, productTitle: x.product_title, author: x.author, rating: x.rating, comment: x.comment }; }

        async function fetchAllData() {
            const [p, r, c] = await Promise.all([
                lsSb.from('products').select('*').order('created_at', { ascending: false }),
                lsSb.from('reviews').select('*').order('created_at', { ascending: false }),
                lsSb.from('categories').select('*').order('name', { ascending: true })
            ]);
            if (p.error) throw p.error;
            productsCache = (p.data || []).map(mapProduct);
            reviewsCache = (r.data || []).map(mapReview);
            categoriesCache = (c.data || []).map(item => item.name);
        }

        let cart = [];
        try { cart = JSON.parse(localStorage.getItem('ls3d_cart')) || []; } catch (e) { cart = []; }
        let currentCategory = 'Tutti';
        let catalogStlRenderer = null;

        function renderCategories() {
            const container = document.getElementById('category-filters');
            if (!container) return;
            const categories = ['Tutti', ...categoriesCache];
            container.innerHTML = categories.map(cat => `
                <button onclick="filterByCategory('${cat.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl border transition-all cursor-pointer ${currentCategory === cat ? 'bg-brand-500 text-black font-bold border-brand-500 shadow-md' : 'bg-dark-card text-gray-400 border-gray-800 hover:border-gray-700 hover:text-white'}">
                    ${esc(cat)}
                </button>
            `).join('');
        }

        function filterByCategory(category) { currentCategory = category; renderCatalog(); }

        function renderCatalog() {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            renderCategories();

            const filteredProducts = currentCategory === 'Tutti' 
                ? productsCache 
                : productsCache.filter(p => {
                    const cats = p.categories || [p.category || ''];
                    return cats.some(c => c.trim().toLowerCase() === currentCategory.trim().toLowerCase());
                });

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 font-mono py-12">Nessun prodotto disponibile in questa categoria.</p>`;
                return;
            }

            grid.innerHTML = filteredProducts.map(p => {
                const mainImg = p.images && p.images.length > 0 ? p.images[p.mainImageIndex || 0] : "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=80";
                const listPrice = Number(p.price) || 0;
                const salePrice = p.salePrice !== null && p.salePrice !== undefined ? Number(p.salePrice) : null;
                const finalPrice = salePrice !== null ? salePrice : listPrice;
                const shippingPrice = Number(p.shipping !== undefined ? p.shipping : 5.00);

                let priceHtml = `<span class="font-mono font-bold text-brand-400 text-sm">€${finalPrice.toFixed(2)}</span>`;
                if (salePrice !== null && salePrice < listPrice) {
                    priceHtml = `<div class="flex items-center gap-2"><span class="font-mono font-bold text-brand-400 text-sm">€${salePrice.toFixed(2)}</span><span class="font-mono text-gray-500 text-xs line-through">€${listPrice.toFixed(2)}</span></div>`;
                }

                return `
                    <div class="bg-dark-card border border-gray-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between group hover:border-gray-700 transition-all">
                        <div onclick="openProductModal(${p.id})" class="cursor-pointer">
                            <div class="h-48 overflow-hidden bg-dark-bg relative">
                                <img src="${mainImg}" alt="${esc(p.title)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                ${salePrice !== null && salePrice < listPrice ? '<span class="absolute top-3 left-3 bg-red-500 text-black font-mono font-bold text-[10px] px-2 py-1 rounded-lg uppercase tracking-wider shadow-lg">In Offerta</span>' : ''}
                                ${p.stlFileName ? '<span class="absolute bottom-3 right-3 bg-brand-500/90 text-black font-mono font-bold text-[10px] px-2 py-0.5 rounded shadow">Modello 3D</span>' : ''}
                            </div>
                            <div class="p-5 space-y-2">
                                <h3 class="font-bold text-white text-base">${esc(p.title)}</h3>
                                <p class="text-xs text-gray-400 leading-relaxed line-clamp-2">${esc(p.shortDesc || '')}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0 border-t border-gray-800/60 mt-4 space-y-3 font-mono">
                            <div class="flex items-center justify-between">
                                <div>${priceHtml}</div>
                                <button onclick="openProductModal(${p.id})" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-xs cursor-pointer">Dettagli</button>
                            </div>
                            <div class="text-[10px] text-gray-400 bg-dark-bg p-2 rounded-lg border border-gray-800/80 flex justify-between items-center">
                                <span>Spedizione: <strong class="text-white">€${shippingPrice.toFixed(2)}</strong></span>
                                <span class="text-brand-400" title="Dal 2° articolo +€2.00">+€2.00 per extra</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            try { lucide.createIcons(); } catch(e){}
        }

        function openProductModal(productId) {
            const p = productsCache.find(prod => prod.id === productId);
            if (!p) return;
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('product-modal-content');
            const images = p.images && p.images.length > 0 ? p.images : ["https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=80"];
            const shippingPrice = Number(p.shipping !== undefined ? p.shipping : 5.00);
            const productColors = p.colors && p.colors.length > 0 ? p.colors : ["Standard"];
            const colorOptions = productColors.map(colorName => `<option value="${esc(colorName)}">● ${esc(colorName)}</option>`).join('');

            const reviews = reviewsCache.filter(r => r.productTitle === p.title);
            const currentUser = getCurrentUser();

            let reviewFormHtml = currentUser ? `
                <div class="bg-dark-bg p-4 rounded-xl border border-gray-800 space-y-3 font-mono">
                    <p class="text-xs font-bold text-white">Lascia una recensione come <span class="text-brand-400">${esc(currentUser.name || currentUser.username)}</span></p>
                    <select id="rev-rating" class="w-full bg-dark-card border border-gray-700/80 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                        <option value="5">5 Stelle - Eccellente</option>
                        <option value="4">4 Stelle - Molto buono</option>
                        <option value="3">3 Stelle - Buono</option>
                        <option value="2">2 Stelle - Sufficiente</option>
                        <option value="1">1 Stella - Scarsa</option>
                    </select>
                    <textarea id="rev-comment" placeholder="Scrivi il tuo commento..." rows="2" class="w-full bg-dark-card border border-gray-700/80 rounded-xl p-2.5 text-xs text-white focus:outline-none"></textarea>
                    <button onclick="submitReview('${p.title.replace(/'/g, "\\'")}')" class="px-4 py-2 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs cursor-pointer">Invia Recensione</button>
                </div>
            ` : `
                <div class="bg-dark-bg p-4 rounded-xl border border-gray-800 text-center space-y-2 font-mono">
                    <p class="text-xs text-gray-400">Effettua l'accesso per poter lasciare recensioni.</p>
                </div>
            `;

            content.innerHTML = `
                <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                    <h2 class="text-lg font-bold text-white font-mono">${esc(p.title)}</h2>
                    <button onclick="closeProductModal()" class="text-gray-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-3">
                        <img id="main-modal-img" src="${images[p.mainImageIndex || 0]}" class="w-full h-64 object-cover rounded-xl border border-gray-800">
                        <div class="flex gap-2 overflow-x-auto pb-2">
                            ${images.map(img => `<img src="${img}" onclick="document.getElementById('main-modal-img').src='${img}'" class="w-16 h-16 object-cover rounded-lg border border-gray-800 cursor-pointer hover:border-brand-500">`).join('')}
                        </div>
                    </div>
                    <div class="space-y-4 font-mono text-xs">
                        <p class="text-gray-300 leading-relaxed">${esc(p.longDesc || p.shortDesc || '')}</p>
                        <p class="text-brand-400 font-bold text-base">€${(p.salePrice !== null && p.salePrice !== undefined ? p.salePrice : p.price).toFixed(2)}</p>
                        <div class="bg-dark-bg p-3 rounded-xl border border-gray-800 space-y-1 text-gray-300">
                            <div class="flex justify-between"><span>Costo Spedizione Base:</span> <strong class="text-white">€${shippingPrice.toFixed(2)}</strong></div>
                            <div class="flex justify-between text-brand-400"><span>Articoli successivi:</span> <strong>+€2.00 cad.</strong></div>
                        </div>
                        <div class="space-y-1 pt-2">
                            <label class="text-gray-400">Colore Filamento:</label>
                            <select id="modal-color" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-2.5 text-white focus:outline-none">${colorOptions}</select>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="addModalToCart('${p.title.replace(/'/g, "\\'")}', ${p.salePrice !== null && p.salePrice !== undefined ? p.salePrice : p.price}, ${shippingPrice})" class="flex-grow py-3.5 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl transition-all shadow-lg cursor-pointer">Aggiungi al Carrello</button>
                            <button onclick="openInquiryModal('${p.title.replace(/'/g, "\\'")}')" class="px-4 py-3.5 bg-dark-surface hover:bg-gray-800 text-white font-bold rounded-xl border border-gray-700 cursor-pointer" title="Richiedi informazioni">Richiedi Info</button>
                        </div>
                    </div>
                </div>
                <div class="border-t border-gray-800 pt-6 space-y-4 font-mono">
                    <h3 class="text-sm font-bold text-white">Recensioni dei Clienti</h3>
                    <div class="space-y-3 max-h-40 overflow-y-auto">
                        ${reviews.length === 0 ? '<p class="text-gray-500 text-xs">Ancora nessuna recensione.</p>' : reviews.map(r => `
                            <div class="bg-dark-bg p-3 rounded-xl border border-gray-800 text-xs">
                                <div class="flex justify-between text-gray-400 text-[10px]">
                                    <span class="font-bold text-white">${esc(r.author)}</span>
                                    <span class="text-brand-400">${r.rating}/5 ★</span>
                                </div>
                                <p class="mt-1 text-gray-300">${esc(r.comment)}</p>
                            </div>
                        `).join('')}
                    </div>
                    ${reviewFormHtml}
                </div>
            `;
            modal.classList.remove('hidden');
            try { lucide.createIcons(); } catch(e){}
        }

        function openInquiryModal(productTitle) {
            const email = prompt(`Inserisci la tua email per richiedere informazioni su "${productTitle}":`);
            if (!email) return;
            const message = prompt("Scrivi il tuo messaggio o la richiesta personalizzata:");
            if (!message) return;

            if (typeof sendContactEmail === 'function') {
                sendContactEmail({ name: "Cliente Catalogo", email: email, message: `Richiesta info per prodotto: ${productTitle}\n\nMessaggio: ${message}` }, 
                    () => alert("Richiesta inviata con successo! Ti risponderemo presto."),
                    (err) => alert("Errore durante l'invio della richiesta.")
                );
            } else {
                alert("Servizio email non disponibile.");
            }
        }

        function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function getCurrentUser() {
            try { const user = localStorage.getItem('ls3d_logged_user'); if (user) return JSON.parse(user); } catch (e) {}
            return null;
        }

        async function submitReview(productTitle) {
            const currentUser = getCurrentUser();
            if (!currentUser) { alert("Devi effettuare l'accesso."); return; }
            const rating = parseInt(document.getElementById('rev-rating').value);
            const comment = document.getElementById('rev-comment').value.trim();
            if (!comment) { alert("Scrivi un commento."); return; }
            const p = productsCache.find(x => x.title === productTitle);
            if (!p) return;
            const row = { product_id: p.id, product_title: productTitle, author: String(currentUser.name || currentUser.username).slice(0, 60), rating, comment: comment.slice(0, 1000) };
            const { data, error } = await lsSb.from('reviews').insert(row).select().single();
            if (error) { alert("Errore nell'invio della recensione."); return; }
            reviewsCache.unshift(mapReview(data));
            alert("Recensione inviata con successo!");
            openProductModal(p.id);
        }

        function addModalToCart(title, price, shipping) {
            const colorSelect = document.getElementById('modal-color');
            const selectedColor = colorSelect ? colorSelect.value : 'Standard';
            const existingIndex = cart.findIndex(i => i.title === title && i.color === selectedColor);
            if (existingIndex > -1) cart[existingIndex].qty += 1;
            else cart.push({ title, price, shipping, color: selectedColor, qty: 1 });
            saveCart();
            updateCartUI();
            closeProductModal();
            toggleCartModal();
        }

        function updateCartUI() {
            const counter = document.getElementById('cart-counter');
            const container = document.getElementById('cart-items-container');
            const totalModal = document.getElementById('cart-modal-total');
            let totalQty = 0, productsPrice = 0, baseShipping = 0;

            if (cart.length === 0) {
                if (container) container.innerHTML = `<p class="text-gray-500 text-center py-6">Il carrello è vuoto.</p>`;
                if (totalModal) totalModal.innerText = "€0.00";
                if (counter) counter.innerText = "0";
                return;
            }

            if (container) {
                container.innerHTML = cart.map((item, index) => {
                    const itemQty = Number(item.qty) || 1;
                    totalQty += itemQty;
                    const itemTotal = (Number(item.price) || 0) * itemQty;
                    productsPrice += itemTotal;
                    const itemShipping = Number(item.shipping !== undefined ? item.shipping : 5.00);
                    if (itemShipping > baseShipping) baseShipping = itemShipping;

                    return `
                        <div class="flex justify-between items-center bg-dark-bg p-3 rounded-xl border border-gray-800">
                            <div>
                                <p class="font-bold text-white">${itemQty}x ${esc(item.title)}</p>
                                <p class="text-[10px] text-gray-400">Colore: <span class="text-brand-400">${esc(item.color)}</span></p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-brand-400">€${itemTotal.toFixed(2)}</span>
                                <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-300 cursor-pointer"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const totalExtraItems = Math.max(0, totalQty - 1);
            const finalShipping = baseShipping + (totalExtraItems * 2.00);

            if (counter) counter.innerText = totalQty;
            if (totalModal) totalModal.innerText = `€${(productsPrice + finalShipping).toFixed(2)}`;
            try { lucide.createIcons(); } catch(e){}
        }

        function removeFromCart(index) { cart.splice(index, 1); saveCart(); updateCartUI(); }
        function saveCart() { try { localStorage.setItem('ls3d_cart', JSON.stringify(cart)); } catch (e) {} }
        function toggleCartModal() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function goToCheckout() { if (cart.length === 0) { alert("Il carrello è vuoto."); return; } window.location.href = "checkout.html"; }

        async function loadData() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '<p class="col-span-full text-center text-gray-500 font-mono py-12">Caricamento prodotti...</p>';
            try { await fetchAllData(); renderCatalog(); }
            catch (e) { console.error(e); grid.innerHTML = '<p class="col-span-full text-center text-red-400 font-mono py-12">Impossibile caricare il catalogo. Riprova più tardi.</p>'; }
        }
        updateCartUI();
        loadData();
    </script>
</body>
</html>
