<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Admin | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Configurazione Globale -->
    <script src="config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-gray-800/85">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-10 sm:h-12 object-contain" onerror="this.src='logo.svg'">
            </a>
            <div class="flex items-center gap-4">
                <a href="catalog.html" class="text-xs font-mono text-gray-400 hover:text-white transition-colors">Vai al Catalogo</a>
                <a href="index.html" class="text-xs font-mono text-gray-400 hover:text-white transition-colors">Home</a>
            </div>
        </div>
    </header>

    <main class="py-12 px-4 sm:px-6 max-w-7xl mx-auto w-full flex-grow space-y-12">
        <div class="border-b border-gray-800 pb-6 flex justify-between items-end">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Pannello di Amministrazione</h1>
                <p class="text-xs font-mono text-gray-400 mt-1">Gestisci prodotti, categorie, foto e recensioni.</p>
            </div>
        </div>

        <!-- GESTIONE CATEGORIE -->
        <section class="bg-dark-card border border-gray-800 p-6 sm:p-8 rounded-2xl space-y-6 shadow-xl">
            <h2 class="text-lg font-bold text-white font-mono">Gestione Categorie</h2>
            <div class="flex gap-3">
                <input type="text" id="new-category-input" placeholder="Nome nuova categoria..." class="flex-grow bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-xs text-white focus:border-brand-500 focus:outline-none">
                <button onclick="addCategory()" class="px-6 py-3 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg cursor-pointer">Aggiungi</button>
            </div>
            <div id="admin-categories-list" class="flex flex-wrap gap-2 pt-2"></div>
        </section>

        <!-- GESTIONE PRODOTTI E FOTO -->
        <section class="bg-dark-card border border-gray-800 p-6 sm:p-8 rounded-2xl space-y-6 shadow-xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <h2 class="text-lg font-bold text-white font-mono" id="product-form-title">Aggiungi / Modifica Prodotto</h2>
                <button onclick="resetProductForm()" id="cancel-edit-btn" class="hidden text-xs text-gray-400 hover:text-white font-mono underline cursor-pointer">Annulla Modifica</button>
            </div>

            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4 text-xs font-mono">
                <input type="hidden" id="edit-product-index" value="">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1">Titolo Prodotto *</label>
                        <input type="text" id="prod-title" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">Categoria *</label>
                        <select id="prod-category" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none"></select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1">Prezzo Listino (€) *</label>
                        <input type="number" step="0.01" id="prod-price" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">Prezzo Scontato (€ opzionale)</label>
                        <input type="number" step="0.01" id="prod-saleprice" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">Spedizione (€) *</label>
                        <input type="number" step="0.01" id="prod-shipping" value="5.00" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 mb-1">Descrizione Breve *</label>
                    <textarea id="prod-desc" required rows="2" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none"></textarea>
                </div>

                <!-- GESTIONE FOTO MULTIPLE -->
                <div class="space-y-2 border border-gray-800 p-4 rounded-xl bg-dark-bg">
                    <label class="block text-white font-bold">Gestione Foto (URL Immagini)</label>
                    <div class="flex gap-2">
                        <input type="text" id="new-image-url" placeholder="Incolla URL immagine (es. https://...)" class="flex-grow bg-dark-card border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                        <button type="button" onclick="addImageUrl()" class="px-5 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-xl transition-all cursor-pointer">Aggiungi Foto</button>
                    </div>
                    <div id="admin-images-preview" class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-3"></div>
                </div>

                <div>
                    <label class="block text-gray-400 mb-1">Colori disponibili (separati da virgola)</label>
                    <input type="text" id="prod-colors" placeholder="Nero Opaco, Bianco, Rosso" value="Nero Opaco" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full py-4 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg cursor-pointer">Salva Prodotto</button>
            </form>

            <div class="pt-8 border-t border-gray-800 space-y-4">
                <h3 class="text-sm font-bold text-white font-mono">Prodotti Esistenti</h3>
                <div id="admin-products-list" class="space-y-3"></div>
            </div>
        </section>

        <!-- GESTIONE RECENSIONI -->
        <section class="bg-dark-card border border-gray-800 p-6 sm:p-8 rounded-2xl space-y-6 shadow-xl">
            <h2 class="text-lg font-bold text-white font-mono">Gestione Recensioni / Commenti</h2>
            <div id="admin-reviews-list" class="space-y-3 font-mono text-xs"></div>
        </section>
    </main>

    <footer class="bg-[#05080e] border-t border-gray-800/80 py-8 text-xs text-gray-500 text-center font-mono">
        LS3DMAKER © 2026 - Admin Panel
    </footer>

    <script>
        let currentEditingImages = [];
        let mainImageIdx = 0;

        function getCategories() {
            try {
                const saved = localStorage.getItem('ls3d_categories');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return ["Accessori", "Gadget", "Maker & Utensili", "Design & Arredo"];
        }

        function saveCategories(cats) {
            localStorage.setItem('ls3d_categories', JSON.stringify(cats));
            renderAdminCategories();
            populateCategoryDropdown();
        }

        function addCategory() {
            const input = document.getElementById('new-category-input');
            const val = input.value.trim();
            if (!val) return;
            const cats = getCategories();
            if (!cats.includes(val)) { cats.push(val); saveCategories(cats); input.value = ''; }
        }

        function deleteCategory(cat) {
            saveCategories(getCategories().filter(c => c !== cat));
        }

        function renderAdminCategories() {
            const container = document.getElementById('admin-categories-list');
            if (!container) return;
            container.innerHTML = getCategories().map(c => `
                <div class="flex items-center gap-2 bg-dark-bg px-3 py-1.5 rounded-xl border border-gray-800 font-mono text-xs">
                    <span>${c}</span>
                    <button type="button" onclick="deleteCategory('${c}')" class="text-red-400 hover:text-red-300 cursor-pointer">×</button>
                </div>
            `).join('');
        }

        function populateCategoryDropdown() {
            const select = document.getElementById('prod-category');
            if (!select) return;
            select.innerHTML = getCategories().map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function getProducts() {
            try {
                const saved = localStorage.getItem('ls3d_products');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return [
                { id: 1, title: "Supporto Cuffie Premium", category: "Accessori", price: 24.99, salePrice: 19.99, shipping: 5.00, shortDesc: "Supporto ergonomico.", images: ["https://images.unsplash.com/photo-1584679109597-c651b16c62db?auto=format&fit=crop&q=80&w=600"], mainImageIndex: 0, colors: ["Nero Opaco"] }
            ];
        }

        function saveProducts(prods) {
            localStorage.setItem('ls3d_products', JSON.stringify(prods));
            renderAdminProducts();
        }

        function addImageUrl() {
            const input = document.getElementById('new-image-url');
            const url = input.value.trim();
            if (!url) return;
            currentEditingImages.push(url);
            input.value = '';
            renderImagesPreview();
        }

        function removeImageUrl(idx) {
            currentEditingImages.splice(idx, 1);
            if (mainImageIdx >= currentEditingImages.length) mainImageIdx = Math.max(0, currentEditingImages.length - 1);
            renderImagesPreview();
        }

        function setMainImage(idx) { mainImageIdx = idx; renderImagesPreview(); }

        function renderImagesPreview() {
            const container = document.getElementById('admin-images-preview');
            if (!container) return;
            if (currentEditingImages.length === 0) {
                container.innerHTML = `<p class="col-span-full text-gray-500 font-mono text-xs">Nessuna foto aggiunta.</p>`;
                return;
            }
            container.innerHTML = currentEditingImages.map((img, idx) => `
                <div class="relative bg-dark-bg border ${idx === mainImageIdx ? 'border-brand-500' : 'border-gray-800'} p-2 rounded-xl flex flex-col items-center gap-2">
                    <img src="${img}" class="w-full h-20 object-cover rounded-lg">
                    <div class="flex items-center justify-between w-full text-[10px]">
                        <button type="button" onclick="setMainImage(${idx})" class="${idx === mainImageIdx ? 'text-brand-400 font-bold' : 'text-gray-400 hover:text-white'}">Principale</button>
                        <button type="button" onclick="removeImageUrl(${idx})" class="text-red-400 hover:text-red-300">Elimina</button>
                    </div>
                </div>
            `).join('');
        }

        function saveProduct(e) {
            e.preventDefault();
            const index = document.getElementById('edit-product-index').value;
            const title = document.getElementById('prod-title').value.trim();
            const category = document.getElementById('prod-category').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const salePriceInput = document.getElementById('prod-saleprice').value;
            const salePrice = salePriceInput ? parseFloat(salePriceInput) : null;
            const shipping = parseFloat(document.getElementById('prod-shipping').value) || 5.00;
            const shortDesc = document.getElementById('prod-desc').value.trim();
            const colors = document.getElementById('prod-colors').value.split(',').map(c => c.trim()).filter(Boolean);

            if (currentEditingImages.length === 0) { alert("Aggiungi almeno un'immagine."); return; }

            const productData = {
                id: index !== '' ? getProducts()[index].id : Date.now(),
                title, category, price, salePrice, shipping, shortDesc,
                images: [...currentEditingImages],
                mainImageIndex: mainImageIdx,
                colors: colors.length > 0 ? colors : ["Standard"]
            };

            const products = getProducts();
            if (index !== '') products[index] = productData;
            else products.push(productData);

            saveProducts(products);
            resetProductForm();
        }

        function editProduct(idx) {
            const p = getProducts()[idx];
            document.getElementById('edit-product-index').value = idx;
            document.getElementById('prod-title').value = p.title;
            document.getElementById('prod-category').value = p.category || getCategories()[0];
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-saleprice').value = p.salePrice !== null && p.salePrice !== undefined ? p.salePrice : '';
            document.getElementById('prod-shipping').value = p.shipping !== undefined ? p.shipping : 5.00;
            document.getElementById('prod-desc').value = p.shortDesc || p.desc || '';
            document.getElementById('prod-colors').value = (p.colors || []).join(', ');
            
            currentEditingImages = [...(p.images || [])];
            mainImageIdx = p.mainImageIndex || 0;
            renderImagesPreview();

            document.getElementById('product-form-title').innerText = "Modifica Prodotto";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetProductForm() {
            document.getElementById('product-form').reset();
            document.getElementById('edit-product-index').value = '';
            document.getElementById('product-form-title').innerText = "Aggiungi / Modifica Prodotto";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            currentEditingImages = [];
            mainImageIdx = 0;
            renderImagesPreview();
        }

        function deleteProduct(idx) {
            if (confirm("Vuoi eliminare questo prodotto?")) {
                const products = getProducts();
                products.splice(idx, 1);
                saveProducts(products);
            }
        }

        function renderAdminProducts() {
            const container = document.getElementById('admin-products-list');
            if (!container) return;
            const products = getProducts();
            if (products.length === 0) { container.innerHTML = `<p class="text-gray-500 text-xs font-mono">Nessun prodotto.</p>`; return; }
            container.innerHTML = products.map((p, idx) => `
                <div class="flex justify-between items-center bg-dark-bg p-3 rounded-xl border border-gray-800 font-mono text-xs">
                    <div class="flex items-center gap-3">
                        <img src="${p.images?.[p.mainImageIndex || 0] || ''}" class="w-10 h-10 object-cover rounded-lg">
                        <div>
                            <p class="font-bold text-white">${p.title}</p>
                            <p class="text-[10px] text-gray-400">Cat: ${p.category || 'Generale'} | €${p.price}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="editProduct(${idx})" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-white rounded-lg cursor-pointer">Modifica</button>
                        <button onclick="deleteProduct(${idx})" class="px-3 py-1.5 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded-lg cursor-pointer">Elimina</button>
                    </div>
                </div>
            `).join('');
        }

        function getReviews() {
            try { const saved = localStorage.getItem('ls3d_reviews'); if (saved) return JSON.parse(saved); } catch (e) {}
            return [];
        }

        function deleteReview(idx) {
            const revs = getReviews();
            revs.splice(idx, 1);
            localStorage.setItem('ls3d_reviews', JSON.stringify(revs));
            renderAdminReviews();
        }

        function renderAdminReviews() {
            const container = document.getElementById('admin-reviews-list');
            if (!container) return;
            const revs = getReviews();
            if (revs.length === 0) { container.innerHTML = `<p class="text-gray-500">Nessuna recensione.</p>`; return; }
            container.innerHTML = revs.map((r, idx) => `
                <div class="flex justify-between items-start bg-dark-bg p-4 rounded-xl border border-gray-800">
                    <div>
                        <p class="font-bold text-white">${r.author} <span class="text-brand-400">(${r.rating}/5 ★)</span> su <span class="text-gray-300">${r.productTitle}</span></p>
                        <p class="text-gray-400 mt-1">${r.comment}</p>
                        <p class="text-[10px] text-gray-500 mt-2">${r.date}</p>
                    </div>
                    <button onclick="deleteReview(${idx})" class="text-red-400 hover:text-red-300 cursor-pointer">Elimina</button>
                </div>
            `).join('');
        }

        renderAdminCategories();
        populateCategoryDropdown();
        renderAdminProducts();
        renderAdminReviews();
        try { lucide.createIcons(); } catch(e){}
    </script>
</body>
</html>
