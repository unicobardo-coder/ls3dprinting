<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Admin | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-gray-800/85">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-10 sm:h-12 object-contain" onerror="this.src='logo.svg'">
            </a>
            <div class="flex items-center gap-4 font-mono text-xs">
                <a href="index.html" class="text-gray-300 hover:text-brand-400 transition-colors">Home</a>
                <a href="catalog.html" class="text-gray-300 hover:text-brand-400 transition-colors">Catalogo</a>
                <button onclick="logoutAdmin()" class="px-4 py-2 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl hover:bg-red-500/20 transition-colors cursor-pointer">Esci</button>
            </div>
        </div>
    </header>

    <main class="py-12 px-4 sm:px-6 max-w-7xl mx-auto w-full flex-grow space-y-8">
        <div class="flex justify-between items-center border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Pannello Amministrativo</h1>
                <p class="text-xs font-mono text-gray-400 mt-1">Gestisci i prodotti, i prezzi, le offerte e la vetrina di LS3Dmaker.</p>
            </div>
            <button onclick="openProductForm()" class="px-5 py-3 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs font-mono transition-all shadow-lg cursor-pointer">
                + Nuovo Prodotto
            </button>
        </div>

        <div id="admin-products-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- MODALE AGGIUNGI / MODIFICA PRODOTTO -->
    <div id="product-form-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-gray-800 w-full max-w-xl rounded-2xl p-6 space-y-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <h2 id="modal-title" class="text-lg font-bold text-white font-mono">Aggiungi Prodotto</h2>
                <button onclick="closeProductForm()" class="text-gray-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4 font-mono text-xs">
                <input type="hidden" id="prod-id">
                <div>
                    <label class="text-gray-400">Titolo Prodotto *</label>
                    <input type="text" id="prod-title" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-gray-400">Prezzo Listino (€) *</label>
                        <input type="number" step="0.01" id="prod-price" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-gray-400">Prezzo in Offerta (€)</label>
                        <input type="number" step="0.01" id="prod-sale-price" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1" placeholder="Lascia vuoto se non in offerta">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-gray-400">Spedizione Base (€)</label>
                        <input type="number" step="0.01" id="prod-shipping" value="5.00" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-gray-400">Categorie (separate da virgola)</label>
                        <input type="text" id="prod-categories" placeholder="Accessori, Gadget" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-gray-400">Descrizione Breve</label>
                    <input type="text" id="prod-short-desc" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1">
                </div>
                <div>
                    <label class="text-gray-400">Descrizione Dettagliata</label>
                    <textarea id="prod-long-desc" rows="3" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1"></textarea>
                </div>
                <div>
                    <label class="text-gray-400">URL Immagini (separate da virgola)</label>
                    <input type="text" id="prod-images" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1" placeholder="https://...">
                </div>
                <div>
                    <label class="text-gray-400">URL File STL (Anteprima 3D)</label>
                    <input type="text" id="prod-stl-url" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:outline-none mt-1" placeholder="Link al file .stl">
                </div>
                <div class="flex items-center gap-3 pt-2">
                    <input type="checkbox" id="prod-featured" class="w-4 h-4 accent-brand-500 rounded">
                    <label class="text-gray-300">Mostra in Vetrina (Homepage)</label>
                </div>
                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="closeProductForm()" class="px-4 py-2.5 bg-gray-800 text-gray-300 rounded-xl cursor-pointer">Annulla</button>
                    <button type="submit" class="px-6 py-2.5 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl cursor-pointer">Salva Prodotto</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-[#05080e] border-t border-gray-800/80 py-8 text-xs text-gray-500 text-center font-mono">
        LS3DMAKER © 2026 - Tutti i diritti riservati
    </footer>

    <script>
        const lsSb = window.supabase.createClient('https://afpurqovvtaexqvcptqm.supabase.co', 'sb_publishable_qiJxli3f8Lm9D36F1SWbsQ_3l2zV8y9');
        let adminProducts = [];
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        async function loadAdminProducts() {
            const container = document.getElementById('admin-products-list');
            container.innerHTML = '<p class="col-span-full text-center text-gray-500 font-mono py-12">Caricamento prodotti...</p>';
            const { data, error } = await lsSb.from('products').select('*').order('created_at', { ascending: false });
            if (error) { container.innerHTML = '<p class="col-span-full text-center text-red-400 font-mono">Errore nel caricamento.</p>'; return; }
            adminProducts = data || [];
            
            if (adminProducts.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-gray-500 font-mono py-12">Nessun prodotto presente.</p>';
                return;
            }

            container.innerHTML = adminProducts.map(p => {
                const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400';
                return `
                    <div class="bg-dark-card border border-gray-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between">
                        <div class="p-4 flex gap-4 items-center border-b border-gray-800/80">
                            <img src="${img}" class="w-16 h-16 object-cover rounded-xl border border-gray-800">
                            <div>
                                <h3 class="font-bold text-white text-sm">${esc(p.title)}</h3>
                                <p class="text-xs text-brand-400 font-mono font-bold mt-1">€${Number(p.price).toFixed(2)} ${p.featured ? '<span class="ml-2 bg-brand-500/20 text-brand-400 px-2 py-0.5 rounded text-[10px]">In Vetrina</span>' : ''}</p>
                            </div>
                        </div>
                        <div class="p-4 flex justify-end gap-2 font-mono text-xs">
                            <button onclick="editProduct(${p.id})" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-xl cursor-pointer">Modifica</button>
                            <button onclick="deleteProduct(${p.id})" class="px-3 py-2 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-xl cursor-pointer">Elimina</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openProductForm() {
            document.getElementById('modal-title').innerText = "Nuovo Prodotto";
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('product-form-modal').classList.remove('hidden');
        }

        function closeProductForm() {
            document.getElementById('product-form-modal').classList.add('hidden');
        }

        function editProduct(id) {
            const p = adminProducts.find(x => x.id === id);
            if (!p) return;
            document.getElementById('modal-title').innerText = "Modifica Prodotto";
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-title').value = p.title || '';
            document.getElementById('prod-price').value = p.price || '';
            document.getElementById('prod-sale-price').value = p.sale_price !== null ? p.sale_price : '';
            document.getElementById('prod-shipping').value = p.shipping !== undefined ? p.shipping : 5.00;
            document.getElementById('prod-categories').value = Array.isArray(p.categories) ? p.categories.join(', ') : (p.category || '');
            document.getElementById('prod-short-desc').value = p.short_desc || '';
            document.getElementById('prod-long-desc').value = p.long_desc || '';
            document.getElementById('prod-images').value = Array.isArray(p.images) ? p.images.join(', ') : '';
            document.getElementById('prod-stl-url').value = p.stl_url || '';
            document.getElementById('prod-featured').checked = !!p.featured;
            document.getElementById('product-form-modal').classList.remove('hidden');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const title = document.getElementById('prod-title').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value);
            const salePriceVal = document.getElementById('prod-sale-price').value.trim();
            const sale_price = salePriceVal === '' ? null : parseFloat(salePriceVal);
            const shipping = parseFloat(document.getElementById('prod-shipping').value) || 5.00;
            const categories = document.getElementById('prod-categories').value.split(',').map(s => s.trim()).filter(Boolean);
            const short_desc = document.getElementById('prod-short-desc').value.trim();
            const long_desc = document.getElementById('prod-long-desc').value.trim();
            const images = document.getElementById('prod-images').value.split(',').map(s => s.trim()).filter(Boolean);
            const stl_url = document.getElementById('prod-stl-url').value.trim() || null;
            const featured = document.getElementById('prod-featured').checked;

            const payload = { title, price, sale_price, shipping, categories, category: categories[0] || 'Generale', short_desc, long_desc, images, stl_url, featured };

            let res;
            if (id) {
                res = await lsSb.from('products').update(payload).eq('id', id);
            } else {
                res = await lsSb.from('products').insert([payload]);
            }

            if (res.error) { alert("Errore nel salvataggio del prodotto."); return; }
            closeProductForm();
            loadAdminProducts();
        }

        async function deleteProduct(id) {
            if (!confirm("Sei sicuro di voler eliminare questo prodotto?")) return;
            const { error } = await lsSb.from('products').delete().eq('id', id);
            if (error) { alert("Errore durante l'eliminazione."); return; }
            loadAdminProducts();
        }

        function logoutAdmin() {
            localStorage.removeItem('ls3d_logged_user');
            window.location.href = 'index.html';
        }

        loadAdminProducts();
    </script>
</body>
</html>
