<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 600: '#059669', 400: '#34d399', 900: '#064e3b' },
                        dark: { bg: '#090d16', card: '#111827', surface: '#151e32' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <a href="index.html" class="text-xs font-mono text-brand-400 hover:underline">← Torna al Sito Pubblico</a>
            <h1 class="text-xl font-bold">LS3Dmaker Admin</h1>
        </div>

        <!-- LOGIN VIEW -->
        <div id="admin-login-view" class="bg-dark-card border border-gray-800 rounded-2xl p-8 max-w-md mx-auto shadow-xl">
            <div class="text-center mb-6">
                <h3 class="text-2xl font-bold text-white">Accesso Riservato</h3>
                <p class="text-xs text-gray-400 mt-1">Inserisci le credenziali di gestione</p>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <input type="text" id="admin-username" required placeholder="admin" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm">
                <input type="password" id="admin-password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm">
                <button type="submit" class="w-full py-3 rounded-xl bg-brand-500 text-black font-bold text-sm">Accedi al Pannello</button>
            </form>
        </div>

        <!-- PANEL VIEW -->
        <div id="admin-panel-view" class="hidden bg-dark-card border border-gray-800 rounded-2xl p-6 sm:p-8 space-y-6 shadow-xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <h3 class="text-xl font-bold text-white">Dashboard Amministrazione</h3>
                <button onclick="adminLogout()" class="text-xs text-red-400 hover:underline font-mono">Logout</button>
            </div>

            <div class="flex flex-wrap gap-2 border-b border-gray-800 pb-2">
                <button onclick="switchAdminTab('products')" id="tab-btn-products" class="px-4 py-2 rounded-xl text-xs font-mono font-bold bg-brand-500 text-black">Prodotti</button>
                <button onclick="switchAdminTab('categories')" id="tab-btn-categories" class="px-4 py-2 rounded-xl text-xs font-mono font-bold bg-gray-800 text-gray-300">Categorie</button>
                <button onclick="switchAdminTab('orders')" id="tab-btn-orders" class="px-4 py-2 rounded-xl text-xs font-mono font-bold bg-gray-800 text-gray-300">Ordini</button>
                <button onclick="switchAdminTab('invoices')" id="tab-btn-invoices" class="px-4 py-2 rounded-xl text-xs font-mono font-bold bg-gray-800 text-gray-300">Fatture</button>
            </div>

            <!-- TAB PRODOTTI -->
            <div id="admin-tab-products" class="space-y-4">
                <form onsubmit="handleSaveProduct(event)" class="space-y-3 bg-gray-900 p-4 rounded-xl border border-gray-800 text-xs">
                    <input type="hidden" id="edit-prod-id">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="new-prod-title" required placeholder="Titolo Prodotto" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
                        <input type="number" step="0.01" id="new-prod-price" required placeholder="Prezzo (€)" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
                    </div>
                    <input type="text" id="new-prod-shortdesc" required placeholder="Descrizione Breve (Home)" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
                    <textarea id="new-prod-fulldesc" rows="3" placeholder="Descrizione Dettagliata" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white"></textarea>
                    
                    <div>
                        <label class="block text-gray-400 mb-1">Categorie:</label>
                        <div id="admin-category-checkboxes" class="flex flex-wrap gap-2 p-2 bg-gray-800 rounded-lg border border-gray-700"></div>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">Foto (Multiple):</label>
                        <input type="file" id="img-files-input" accept="image/*" multiple onchange="handleMultipleImages(event)" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="new-prod-hidden" class="rounded bg-gray-800 border-gray-700 text-brand-500">
                        <label for="new-prod-hidden" class="text-gray-300">Nascondi prodotto</label>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="btn-save-prod" class="flex-1 py-2 bg-brand-500 text-black font-bold rounded-lg">+ Salva Prodotto</button>
                        <button type="button" onclick="resetAdminForm()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded-lg">Annulla</button>
                    </div>
                </form>
                <div id="admin-products-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
            </div>

            <!-- TAB CATEGORIE -->
            <div id="admin-tab-categories" class="hidden space-y-4">
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex gap-2">
                    <input type="text" id="new-cat-name" placeholder="Nuova categoria..." class="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                    <button onclick="addNewCategory()" class="px-4 py-2 bg-brand-500 text-black font-bold text-xs rounded-lg">+ Aggiungi</button>
                </div>
                <div id="admin-categories-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
            </div>

            <!-- TAB ORDINI -->
            <div id="admin-tab-orders" class="hidden space-y-4">
                <div id="admin-orders-list" class="space-y-3 max-h-80 overflow-y-auto"></div>
            </div>

            <!-- TAB FATTURE -->
            <div id="admin-tab-invoices" class="hidden space-y-4">
                <div id="admin-invoices-list" class="space-y-3 max-h-80 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        let categories = JSON.parse(localStorage.getItem('ls3d_categories')) || ["Componenti", "Decorazioni", "Prototipi", "Gadget"];
        let products = JSON.parse(localStorage.getItem('ls3d_products')) || [];
        let orders = JSON.parse(localStorage.getItem('ls3d_orders')) || [];
        let uploadedImagesList = [];
        const defaultImg = "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=80";

        function handleAdminLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-username').value === 'admin' && document.getElementById('admin-password').value === 'ls3d2026') {
                document.getElementById('admin-login-view').classList.add('hidden');
                document.getElementById('admin-panel-view').classList.remove('hidden');
                initAdminPanel();
            } else {
                alert('Credenziali errate!');
            }
        }

        function adminLogout() {
            document.getElementById('admin-panel-view').classList.add('hidden');
            document.getElementById('admin-login-view').classList.remove('hidden');
        }

        function switchAdminTab(tab) {
            ['products', 'categories', 'orders', 'invoices'].forEach(t => {
                document.getElementById(`admin-tab-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`tab-btn-${t}`).className = t === tab ? 'px-4 py-2 rounded-xl text-xs font-mono font-bold bg-brand-500 text-black' : 'px-4 py-2 rounded-xl text-xs font-mono font-bold bg-gray-800 text-gray-300';
            });
        }

        function initAdminPanel() {
            renderAdminCategoriesCheckboxes();
            renderAdminProductsList();
            renderAdminCategoriesList();
            renderAdminOrdersList();
            renderAdminInvoicesList();
            lucide.createIcons();
        }

        function renderAdminCategoriesCheckboxes() {
            document.getElementById('admin-category-checkboxes').innerHTML = categories.map(c => `
                <label class="flex items-center gap-1.5 text-xs text-gray-300 bg-gray-900 px-2 py-1 rounded border border-gray-700 cursor-pointer">
                    <input type="checkbox" name="prod-categories" value="${c}" class="rounded text-brand-500"> ${c}
                </label>
            `).join('');
        }

        function handleMultipleImages(e) {
            uploadedImagesList = [];
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = evt => uploadedImagesList.push(evt.target.result);
                reader.readAsDataURL(file);
            });
        }

        function handleSaveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('edit-prod-id').value;
            const title = document.getElementById('new-prod-title').value;
            const price = parseFloat(document.getElementById('new-prod-price').value);
            const shortDesc = document.getElementById('new-prod-shortdesc').value;
            const desc = document.getElementById('new-prod-fulldesc').value;
            const isHidden = document.getElementById('new-prod-hidden').checked;
            const selectedCats = Array.from(document.querySelectorAll('input[name="prod-categories"]:checked')).map(cb => cb.value);

            if (id) {
                const p = products.find(prod => prod.id == id);
                if (p) {
                    p.title = title; p.price = price; p.shortDesc = shortDesc; p.desc = desc;
                    p.categories = selectedCats; p.hidden = isHidden;
                    if(uploadedImagesList.length > 0) p.images = uploadedImagesList;
                }
            } else {
                products.unshift({
                    id: Date.now(), title, price, shortDesc, desc,
                    categories: selectedCats, 
                    images: uploadedImagesList.length > 0 ? uploadedImagesList : [defaultImg], hidden: isHidden
                });
            }

            localStorage.setItem('ls3d_products', JSON.stringify(products));
            resetAdminForm();
            renderAdminProductsList();
            alert('Prodotto salvato!');
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            document.getElementById('edit-prod-id').value = p.id;
            document.getElementById('new-prod-title').value = p.title;
            document.getElementById('new-prod-price').value = p.price;
            document.getElementById('new-prod-shortdesc').value = p.shortDesc || '';
            document.getElementById('new-prod-fulldesc').value = p.desc || '';
            document.getElementById('new-prod-hidden').checked = p.hidden || false;
            document.getElementById('btn-save-prod').innerText = "Aggiorna Prodotto";

            document.querySelectorAll('input[name="prod-categories"]').forEach(cb => cb.checked = p.categories && p.categories.includes(cb.value));
            uploadedImagesList = p.images || [];
        }

        function resetAdminForm() {
            document.getElementById('edit-prod-id').value = '';
            document.getElementById('new-prod-title').value = '';
            document.getElementById('new-prod-price').value = '';
            document.getElementById('new-prod-shortdesc').value = '';
            document.getElementById('new-prod-fulldesc').value = '';
            document.getElementById('new-prod-hidden').checked = false;
            document.getElementById('img-files-input').value = '';
            document.getElementById('btn-save-prod').innerText = "+ Salva Prodotto";
            uploadedImagesList = [];
            document.querySelectorAll('input[name="prod-categories"]').forEach(cb => cb.checked = false);
        }

        function renderAdminProductsList() {
            document.getElementById('admin-products-list').innerHTML = products.map(p => `
                <div class="flex justify-between items-center p-3 bg-gray-900 rounded-xl border border-gray-800 text-xs">
                    <div>
                        <span class="font-bold text-white">${p.title}</span>
                        ${p.hidden ? `<span class="ml-2 px-1.5 py-0.5 text-[9px] bg-amber-500/20 text-amber-400 rounded">Nascosto</span>` : ''}
                        <p class="text-gray-400 text-[10px]">${(p.categories || []).join(', ')}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="editProduct(${p.id})" class="px-2.5 py-1 bg-brand-500/20 text-brand-400 rounded text-[10px] font-bold">Modifica</button>
                        <button onclick="toggleHideProduct(${p.id})" class="px-2.5 py-1 bg-gray-800 text-gray-300 rounded text-[10px]">${p.hidden ? 'Mostra' : 'Nascondi'}</button>
                        <button onclick="deleteProduct(${p.id})" class="px-2.5 py-1 bg-red-500/20 text-red-400 rounded text-[10px] font-bold">Elimina</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleHideProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (p) {
                p.hidden = !p.hidden;
                localStorage.setItem('ls3d_products', JSON.stringify(products));
                renderAdminProductsList();
            }
        }

        function deleteProduct(id) {
            if (confirm("Eliminare definitivamente questo prodotto?")) {
                products = products.filter(prod => prod.id !== id);
                localStorage.setItem('ls3d_products', JSON.stringify(products));
                renderAdminProductsList();
            }
        }

        function addNewCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if(!name || categories.includes(name)) return;
            categories.push(name);
            localStorage.setItem('ls3d_categories', JSON.stringify(categories));
            document.getElementById('new-cat-name').value = '';
            renderAdminCategoriesCheckboxes();
            renderAdminCategoriesList();
        }

        function deleteCategory(cat) {
            categories = categories.filter(c => c !== cat);
            localStorage.setItem('ls3d_categories', JSON.stringify(categories));
            renderAdminCategoriesCheckboxes();
            renderAdminCategoriesList();
        }

        function renderAdminCategoriesList() {
            document.getElementById('admin-categories-list').innerHTML = categories.map(c => `
                <div class="flex justify-between items-center p-3 bg-gray-900 rounded-xl border border-gray-800 text-xs font-mono">
                    <span class="text-white">${c}</span>
                    <button onclick="deleteCategory('${c}')" class="px-2 py-1 bg-red-500/20 text-red-400 rounded text-[10px]">Elimina</button>
                </div>
            `).join('');
        }

        function renderAdminOrdersList() {
            const container = document.getElementById('admin-orders-list');
            if(orders.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 font-mono">Nessun ordine presente.</p>`;
                return;
            }
            container.innerHTML = orders.map(o => `
                <div class="p-3 bg-gray-900 rounded-xl border border-gray-800 text-xs space-y-2 font-mono">
                    <div class="flex justify-between"><strong class="text-brand-400">${o.id} - ${o.name}</strong><span>€${o.total.toFixed(2)}</span></div>
                    <div class="grid grid-cols-2 gap-2">
                        <select onchange="updateOrderStatus('${o.id}', this.value)" class="bg-gray-800 text-white rounded p-1">
                            <option ${o.status==='In Elaborazione'?'selected':''}>In Elaborazione</option>
                            <option ${o.status==='Pagato'?'selected':''}>Pagato</option>
                            <option ${o.status==='In Stampa 3D'?'selected':''}>In Stampa 3D</option>
                            <option ${o.status==='Spedito'?'selected':''}>Spedito</option>
                        </select>
                        <input type="text" value="${o.tracking}" onchange="updateOrderTracking('${o.id}', this.value)" placeholder="Codice Tracking" class="bg-gray-800 text-white rounded p-1">
                    </div>
                </div>
            `).join('');
        }

        function renderAdminInvoicesList() {
            const container = document.getElementById('admin-invoices-list');
            if(orders.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 font-mono">Nessuna fattura emessa.</p>`;
                return;
            }
            container.innerHTML = orders.map(o => `
                <div class="flex justify-between items-center p-3 bg-gray-900 rounded-xl border border-gray-800 text-xs font-mono">
                    <div>
                        <strong class="text-white">Fattura n. ${o.number}</strong> (${o.name})
                        <p class="text-gray-400 text-[10px]">Totale: €${o.total.toFixed(2)} - Email: ${o.email}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateOrderStatus(id, val) {
            const o = orders.find(x => x.id === id);
            if(o) { o.status = val; localStorage.setItem('ls3d_orders', JSON.stringify(orders)); }
        }
        function updateOrderTracking(id, val) {
            const o = orders.find(x => x.id === id);
            if(o) { o.tracking = val; localStorage.setItem('ls3d_orders', JSON.stringify(orders)); }
        }
    </script>
</body>
</html>
