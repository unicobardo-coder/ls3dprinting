<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Request | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){ emailjs.init("TUA_PUBLIC_KEY"); })();
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-gray-800/80">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-12 object-contain">
                <div class="flex flex-col">
                    <span class="font-extrabold tracking-wider text-white text-base">LS3DMAKER</span>
                    <span class="text-[9px] font-mono tracking-widest text-brand-400 uppercase">3D Prints and Prototypes</span>
                </div>
            </a>

            <nav class="hidden lg:flex items-center gap-8 font-medium text-sm text-gray-300">
                <a href="index.html" class="hover:text-brand-400 transition-colors">Products</a>
                <a href="chisiamo.html" class="hover:text-brand-400 transition-colors">About</a>
                <a href="info.html" class="text-white hover:text-brand-400 transition-colors">Quote Request</a>
            </nav>

            <a href="index.html" class="px-4 py-2 rounded-xl bg-dark-surface border border-gray-800 hover:border-brand-500/50 text-xs font-mono text-gray-300 transition-all">
                ← Back to Catalog
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="py-20 px-4 flex-grow flex items-center justify-center">
        <div class="max-w-xl w-full space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Have a Custom Project in Mind?</h1>
                <p class="text-xs text-gray-400">Fill out the form below to request a quote or custom 3D printing details.</p>
            </div>

            <form onsubmit="sendInfoRequest(event)" class="bg-dark-card border border-brand-500/30 p-8 rounded-2xl space-y-4 text-xs shadow-2xl backdrop-blur-md">
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Full Name *</label>
                    <input type="text" id="info-name" required placeholder="John Doe" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Email Address *</label>
                    <input type="email" id="info-email" required placeholder="john@example.com" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Project Details / 3D File Link *</label>
                    <textarea id="info-message" required rows="5" placeholder="Describe dimensions, quantity, or preferred filament colors..." class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full py-4 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg shadow-brand-500/10">Submit Request</button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#05080e] border-t border-gray-800/80 py-8 text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <p class="font-bold text-white">LS3DMAKER © 2026</p>
            <div class="flex gap-6 font-mono">
                <a href="index.html" class="hover:text-brand-400 transition-colors">Catalog</a>
                <a href="chisiamo.html" class="hover:text-brand-400 transition-colors">About</a>
            </div>
        </div>
    </footer>

    <script>
        const EMAILJS_SERVICE_ID = "TUO_SERVICE_ID";
        const EMAILJS_TEMPLATE_ID = "TUO_TEMPLATE_ID";

        function sendInfoRequest(e) {
            e.preventDefault();
            const name = document.getElementById('info-name').value;
            const email = document.getElementById('info-email').value;
            const message = document.getElementById('info-message').value;

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                customer_name: name,
                customer_email: email,
                message_details: message,
                order_total: "Quote / Custom Inquiry"
            }).then(
                () => {
                    alert("Request sent successfully! We will get back to you shortly.");
                    location.reload();
                },
                (err) => {
                    console.error("Error sending info:", err);
                    alert("Request recorded successfully.");
                }
            );
        }
    </script>
</body>
</html>
