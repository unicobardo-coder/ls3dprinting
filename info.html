<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richiedi Info & Preventivi | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- EmailJS SDK per il modulo richieste -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){ emailjs.init("TUA_PUBLIC_KEY"); })();
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 600: '#059669', 400: '#34d399', 900: '#064e3b' },
                        dark: { bg: '#090d16', card: '#111827', surface: '#151e32' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-dark-card/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-18 sm:h-24 object-contain">
            </a>

            <nav class="hidden md:flex items-center gap-6 font-medium text-sm text-gray-300">
                <a href="index.html" class="hover:text-brand-400 transition-colors">Catalogo</a>
                <a href="chisiamo.html" class="hover:text-brand-400 transition-colors">Chi Siamo</a>
                <a href="info.html" class="text-brand-400 font-bold">Richiedi Info</a>
            </nav>

            <a href="index.html" class="px-3.5 py-2 rounded-xl bg-gray-800 text-gray-300 text-xs font-mono border border-gray-700 hover:border-brand-500 transition-colors">
                ← Torna al Catalogo
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT - MODULO INFO -->
    <main class="py-16 px-4 flex-grow flex items-center justify-center">
        <div class="max-w-xl w-full space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-extrabold text-white">Hai un progetto o un'idea su misura?</h1>
                <p class="text-xs text-gray-400">Compila il modulo per richiedere informazioni, un preventivo o una stampa personalizzata.</p>
            </div>

            <form onsubmit="sendInfoRequest(event)" class="bg-dark-card border border-gray-800 p-6 sm:p-8 rounded-2xl space-y-4 text-xs shadow-2xl">
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Il tuo Nome e Cognome *</label>
                    <input type="text" id="info-name" required placeholder="Mario Rossi" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Tua Email *</label>
                    <input type="email" id="info-email" required placeholder="mario@example.com" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Dettagli della richiesta / File o Link 3D *</label>
                    <textarea id="info-message" required rows="5" placeholder="Descrivi l'oggetto, le dimensioni, la quantità o il colore del filamento desiderato..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full py-4 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-transform hover:scale-[1.01]">Invia Richiesta</button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-950 border-t border-gray-800 py-8 text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <p class="font-bold text-white">LS3Dmaker © 2026</p>
            <div class="flex gap-4 font-mono">
                <a href="index.html" class="hover:underline">Home</a>
                <a href="chisiamo.html" class="hover:underline">Chi Siamo</a>
            </div>
        </div>
    </footer>

    <script>
        const EMAILJS_SERVICE_ID = "TUO_SERVICE_ID";
        const EMAILJS_TEMPLATE_ID = "TUO_TEMPLATE_ID";

        function sendInfoRequest(e) {
            e.preventDefault();
            const name = document.getElementById('info-name').value;
            const email = document.getElementById('info-email').value;
            const message = document.getElementById('info-message').value;

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                customer_name: name,
                customer_email: email,
                message_details: message,
                order_total: "Richiesta Informazioni / Preventivo Personalizzato"
            }).then(
                () => {
                    alert("Richiesta inviata con successo! Ti risponderemo presto.");
                    location.reload();
                },
                (err) => {
                    console.error("Errore invio info:", err);
                    alert("Richiesta registrata. (Controlla la configurazione EmailJS).");
                }
            );
        }
    </script>
</body>
</html>
