<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS3Dmaker | Stampa 3D su Misura, Prototipazione & Modelli STL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 600: '#059669', 400: '#34d399' },
                        dark: { bg: '#090d16', card: '#111827', surface: '#151e32' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-dark-card/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="#" onclick="showPage('home')" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center font-mono font-black text-black text-xl">LS</div>
                <span class="font-bold text-lg">LS3Dmaker</span>
            </a>

            <div class="flex items-center gap-3">
                <button onclick="openCartModal()" class="relative flex items-center gap-2 px-3.5 py-2 rounded-xl bg-brand-500/10 hover:bg-brand-500/20 text-brand-400 text-xs font-mono border border-brand-500/30">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Carrello
                    <span id="cart-badge" class="px-1.5 py-0.5 rounded-full bg-brand-500 text-black text-[10px] font-bold">0</span>
                </button>
                <button onclick="openAdminModal()" class="px-3.5 py-2 rounded-xl bg-gray-800 text-gray-300 text-xs font-mono border border-gray-700">
                    <i data-lucide="lock" class="w-3.5 h-3.5 text-brand-400 inline"></i> Admin
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Filtri Categorie -->
        <div class="mb-6">
            <h2 class="text-xl font-bold mb-3">Filtra per Categorie</h2>
            <div id="category-filters" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Griglia Prodotti -->
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>

    <!-- MODALE CARRELLO CON GESTIONE QUANTITA' ED ELIMINAZIONE -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card border border-gray-800 rounded-2xl max-w-xl w-full p-6 relative">
            <button onclick="closeCartModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            <h3 class="text-xl font-bold mb-4">Il Tuo Carrello</h3>
            
            <div id="cart-items-list" class="space-y-3 max-h-60 overflow-y-auto pr-2 mb-6 border-y border-gray-800 py-4"></div>

            <div class="flex justify-between items-center mb-6 font-mono p-4 bg-gray-900 rounded-xl">
                <span class="text-xs text-gray-400 uppercase">Totale:</span>
                <span id="cart-total" class="text-2xl font-bold text-brand-400">€0.00</span>
            </div>

            <button onclick="openCheckout()" class="w-full py-3 rounded-xl bg-brand-500 text-black font-bold text-sm">Procedi al Checkout</button>
        </div>
    </div>

    <!-- MODALE ADMIN CON CATEGORIE MULTIPLE E NASCONDI PRODOTTO -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card border border-gray-800 rounded-2xl max-w-3xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            <h3 class="text-xl font-bold mb-4">Gestione Prodotti (Admin)</h3>

            <form onsubmit="handleSaveProduct(event)" class="space-y-4 bg-gray-900 p-4 rounded-xl border border-gray-800 mb-6">
                <input type="hidden" id="edit-prod-id">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="new-prod-title" required placeholder="Titolo Prodotto" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                    <input type="number" step="0.01" id="new-prod-price" required placeholder="Prezzo (€)" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                </div>

                <!-- SELEZIONE CATEGORIE MULTIPLE -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Seleziona una o più Categorie (Tieni premuto Ctrl/Cmd per selezione multipla):</label>
                    <select id="new-prod-categories" multiple class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white h-24"></select>
                </div>

                <textarea id="new-prod-desc" placeholder="Descrizione" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white"></textarea>

                <div class="flex items-center gap-2">
                    <input type="checkbox" id="new-prod-hidden" class="rounded bg-gray-800 border-gray-700 text-brand-500">
                    <label for="new-prod-hidden" class="text-xs text-gray-300">Nascondi prodotto nel catalogo pubblico</label>
                </div>

                <button type="submit" class="w-full py-2 bg-brand-500 text-black font-bold text-xs rounded-lg">+ Salva Prodotto</button>
            </form>

            <div id="admin-products-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        let categories = JSON.parse(localStorage.getItem('ls3d_categories')) || ["Componenti", "Decorazioni", "Prototipi", "Gadget"];
        let selectedCategory = "Tutti";

        let products = JSON.parse(localStorage.getItem('ls3d_products')) || [
            { id: 1, title: "Fermalibri Cyber", price: 34.90, desc: "Design futurista", categories: ["Decorazioni"], hidden: false }
        ];

        let cart = JSON.parse(localStorage.getItem('ls3d_cart')) || [];

        function renderCategories() {
            const container = document.getElementById('category-filters');
            container.innerHTML = ['Tutti', ...categories].map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-3 py-1 rounded-xl text-xs font-mono ${selectedCategory === cat ? 'bg-brand-500 text-black font-bold' : 'bg-gray-800 text-gray-300'}">
                    ${cat}
                </button>
            `).join('');

            const selectAdmin = document.getElementById('new-prod-categories');
            selectAdmin.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            // Filtra per categoria e nasconde i prodotti segnati come "hidden"
            const visibleProducts = products.filter(p => !p.hidden);
            const filtered = selectedCategory === "Tutti" 
                ? visibleProducts 
                : visibleProducts.filter(p => p.categories && p.categories.includes(selectedCategory));

            grid.innerHTML = filtered.map(p => `
                <div class="bg-dark-card border border-gray-800 rounded-2xl p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex flex-wrap gap-1 mb-2">
                            ${(p.categories || []).map(c => `<span class="bg-gray-800 text-gray-400 text-[10px] px-2 py-0.5 rounded border border-gray-700">${c}</span>`).join('')}
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">${p.title}</h3>
                        <p class="text-gray-400 text-xs mb-4">${p.desc}</p>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-800 pt-4">
                        <span class="text-xl font-bold font-mono">€${p.price.toFixed(2)}</span>
                        <button onclick="addToCart(${p.id})" class="px-3.5 py-2 rounded-xl bg-brand-500 text-black font-bold text-xs">+ Aggiungi</button>
                    </div>
                </div>
            `).join('');
        }

        // --- GESTIONE CARRELLO (QUANTITA' ED ELIMINAZIONE) ---
        function addToCart(prodId) {
            const product = products.find(p => p.id === prodId);
            if (!product) return;
            const existing = cart.find(item => item.id === prodId);
            if (existing) existing.qty += 1;
            else cart.push({ id: product.id, title: product.title, price: product.price, qty: 1 });
            saveCart();
            openCartModal();
        }

        function updateQuantity(prodId, delta) {
            const item = cart.find(i => i.id === prodId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                removeFromCart(prodId);
            } else {
                saveCart();
                openCartModal();
            }
        }

        function removeFromCart(prodId) {
            cart = cart.filter(i => i.id !== prodId);
            saveCart();
            openCartModal();
        }

        function saveCart() {
            localStorage.setItem('ls3d_cart', JSON.stringify(cart));
            document.getElementById('cart-badge').innerText = cart.reduce((acc, item) => acc + item.qty, 0);
        }

        function openCartModal() {
            const container = document.getElementById('cart-items-list');
            const totalEl = document.getElementById('cart-total');

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 text-xs py-4 font-mono">Il carrello è vuoto.</div>`;
                totalEl.innerText = "€0.00";
            } else {
                let total = 0;
                container.innerHTML = cart.map(i => {
                    total += i.price * i.qty;
                    return `
                        <div class="flex justify-between items-center p-3 bg-gray-900 rounded-xl border border-gray-800 text-xs">
                            <div class="flex-1">
                                <p class="font-bold text-white">${i.title}</p>
                                <p class="text-brand-400 font-mono">€${i.price.toFixed(2)} Cad.</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="flex items-center border border-gray-700 rounded-lg overflow-hidden bg-gray-800">
                                    <button onclick="updateQuantity(${i.id}, -1)" class="px-2.5 py-1 text-white hover:bg-gray-700 font-bold">-</button>
                                    <span class="px-3 font-mono text-white font-bold">${i.qty}</span>
                                    <button onclick="updateQuantity(${i.id}, 1)" class="px-2.5 py-1 text-white hover:bg-gray-700 font-bold">+</button>
                                </div>
                                <button onclick="removeFromCart(${i.id})" class="p-1.5 text-red-400 hover:text-red-300">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
                totalEl.innerText = `€${total.toFixed(2)}`;
            }
            lucide.createIcons();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }

        // --- ADMIN: SALVATAGGIO CON CATEGORIE MULTIPLE E PRODOTTO NASCOSTO ---
        function handleSaveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('edit-prod-id').value;
            const title = document.getElementById('new-prod-title').value;
            const price = parseFloat(document.getElementById('new-prod-price').value);
            const desc = document.getElementById('new-prod-desc').value;
            const isHidden = document.getElementById('new-prod-hidden').checked;

            const selectCat = document.getElementById('new-prod-categories');
            const selectedCats = Array.from(selectCat.selectedOptions).map(opt => opt.value);

            if (id) {
                const p = products.find(prod => prod.id == id);
                if (p) {
                    p.title = title; p.price = price; p.desc = desc;
                    p.categories = selectedCats; p.hidden = isHidden;
                }
            } else {
                products.unshift({
                    id: Date.now(), title, price, desc,
                    categories: selectedCats, hidden: isHidden
                });
            }

            localStorage.setItem('ls3d_products', JSON.stringify(products));
            renderProducts();
            renderAdminProductsList();
            alert('Prodotto salvato!');
        }

        function renderAdminProductsList() {
            const container = document.getElementById('admin-products-list');
            container.innerHTML = products.map(p => `
                <div class="flex justify-between items-center p-3 bg-gray-900 rounded-xl border border-gray-800 text-xs">
                    <div>
                        <span class="font-bold text-white">${p.title}</span>
                        ${p.hidden ? `<span class="ml-2 px-1.5 py-0.5 text-[9px] bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded">Nascosto</span>` : ''}
                        <p class="text-gray-400 text-[10px]">${(p.categories || []).join(', ')}</p>
                    </div>
                    <button onclick="toggleHideProduct(${p.id})" class="px-2 py-1 bg-gray-800 text-gray-300 rounded text-[10px] border border-gray-700">
                        ${p.hidden ? 'Mostra' : 'Nascondi'}
                    </button>
                </div>
            `).join('');
        }

        function toggleHideProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (p) {
                p.hidden = !p.hidden;
                localStorage.setItem('ls3d_products', JSON.stringify(products));
                renderProducts();
                renderAdminProductsList();
            }
        }

        function openAdminModal() { 
            renderAdminProductsList();
            document.getElementById('admin-modal').classList.remove('hidden'); 
        }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

        renderCategories();
        renderProducts();
        saveCart();
    </script>
</body>
</html>
