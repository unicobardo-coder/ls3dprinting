<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS3Dmaker | 3D Prints and Prototypes</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-gray-800/80">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-10 sm:h-12 object-contain" onerror="this.src='logo.svg'">
            </a>

            <nav class="hidden lg:flex items-center gap-8 font-medium text-sm text-gray-300">
                <a href="index.html" class="text-white hover:text-brand-400 transition-colors" data-i18n="navProducts">Prodotti</a>
                <a href="chisiamo.html" class="hover:text-brand-400 transition-colors" data-i18n="navAbout">Chi Siamo</a>
                <a href="info.html" class="hover:text-brand-400 transition-colors" data-i18n="navQuote">Preventivi</a>
            </nav>

            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-dark-surface border border-gray-800 text-xs font-mono text-gray-300">
                    <select id="lang-select" onchange="setLanguage(this.value)" class="bg-transparent text-gray-300 focus:outline-none cursor-pointer">
                        <option value="it" class="bg-dark-bg text-white">🇮🇹 IT</option>
                        <option value="en" class="bg-dark-bg text-white">🇬🇧 EN</option>
                        <option value="es" class="bg-dark-bg text-white">🇪🇸 ES</option>
                        <option value="fr" class="bg-dark-bg text-white">🇫🇷 FR</option>
                    </select>
                </div>

                <button onclick="openCartModal()" class="relative px-4 py-2 bg-dark-surface rounded-xl border border-gray-800 hover:border-brand-500/50 transition-all flex items-center gap-2 text-xs font-medium">
                    <i data-lucide="shopping-cart" class="w-4 h-4 text-brand-400"></i>
                    <span data-i18n="cartTitle">Carrello</span>
                    <span id="cart-badge" class="bg-brand-500 text-black text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center font-mono">0</span>
                </button>

                <a href="admin.html" class="px-3.5 py-2 rounded-xl bg-dark-surface border border-gray-800 hover:border-brand-500/50 transition-all flex items-center gap-2 text-xs font-medium text-gray-300">
                    <i data-lucide="user" class="w-4 h-4 text-gray-400"></i>
                    <span class="hidden sm:inline" data-i18n="navAdmin">Admin</span>
                </a>
            </div>
        </div>
    </header>

    <section class="relative py-28 px-4 overflow-hidden bg-gradient-to-b from-dark-bg via-[#07101e] to-dark-bg border-b border-gray-800/50">
        <div class="max-w-4xl mx-auto text-center space-y-8 relative z-10">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-dark-surface border border-brand-500/30 text-brand-400 text-xs font-mono tracking-wider uppercase shadow-lg">
                <i data-lucide="box" class="w-3.5 h-3.5"></i>
                <span data-i18n="heroBadge">Soluzioni di Stampa 3D & Prototipazione</span>
            </div>
            <h1 class="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-tight">
                <span data-i18n="heroTitle1">Trasforma le tue idee in</span> <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-emerald-200" data-i18n="heroTitle2">Stampe 3D</span>
            </h1>
        </div>
    </section>

    <!-- CATALOGO -->
    <main class="py-16 px-4 flex-grow max-w-7xl mx-auto w-full space-y-8">
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h2 class="text-2xl font-bold text-white tracking-tight" data-i18n="catalogTitle">Cataloghi & Modelli</h2>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- MODALE DETTAGLIO PRODOTTO (DESCRIZIONE LUNGA) -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-brand-500/30 w-full max-w-2xl rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-lg">✕</button>
            <div id="modal-content" class="space-y-4"></div>
        </div>
    </div>

    <!-- CARRELLO MODALE -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-gray-800 w-full max-w-lg rounded-2xl p-6 space-y-6 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <h3 class="text-lg font-bold text-white" data-i18n="cartTitle">Carrello</h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <div id="cart-items-container" class="space-y-4 max-h-60 overflow-y-auto font-mono text-xs"></div>
            <div class="border-t border-gray-800 pt-4 flex justify-between items-center font-bold text-sm">
                <span data-i18n="cartTotal">Totale Carrello:</span>
                <span id="cart-total-price" class="text-brand-400">€0.00</span>
            </div>
            <div class="flex gap-3">
                <button onclick="closeCartModal()" class="flex-1 py-3 bg-gray-800 text-gray-300 rounded-xl text-xs hover:bg-gray-700" data-i18n="continueShopping">Continua Shopping</button>
                <a href="checkout.html" class="flex-1 py-3 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs text-center flex items-center justify-center transition-all" data-i18n="checkoutBtn">Vai al Checkout →</a>
            </div>
        </div>
    </div>

    <footer class="bg-[#05080e] border-t border-gray-800/80 py-8 text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <p class="font-bold text-white">LS3DMAKER © 2026</p>
            <div class="flex gap-6 font-mono">
                <a href="admin.html" class="hover:text-brand-400 text-brand-400">Admin</a>
            </div>
        </div>
    </footer>

    <script src="colors.js"></script>
    <script src="i18n.js"></script>
    <script>
        const defaultImg = "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=80";
        let products = JSON.parse(localStorage.getItem('ls3d_products')) || [];
        let cart = JSON.parse(localStorage.getItem('ls3d_cart')) || [];

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const activeProducts = products.filter(p => !p.hidden);

            if (activeProducts.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 text-xs font-mono col-span-full text-center py-8">Nessun prodotto disponibile.</p>`;
                return;
            }

            grid.innerHTML = activeProducts.map(p => {
                const mainImg = p.images && p.images.length > 0 ? p.images[p.mainImageIndex || 0] : defaultImg;
                return `
                    <div class="bg-dark-card border border-gray-800/80 hover:border-brand-500/40 transition-all rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between group">
                        <div>
                            <div class="relative overflow-hidden cursor-pointer" onclick="openProductModal(${p.id})">
                                <img src="${mainImg}" alt="${p.title}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500">
                                <span class="absolute top-2 right-2 px-2 py-0.5 rounded bg-black/60 backdrop-blur text-[10px] font-mono text-brand-400 border border-brand-500/30">${p.category || 'Generale'}</span>
                            </div>
                            <div class="p-5 space-y-2">
                                <h3 class="font-bold text-white text-base cursor-pointer hover:text-brand-400" onclick="openProductModal(${p.id})">${p.title}</h3>
                                <p class="text-xs text-gray-400 leading-relaxed">${p.shortDesc || ''}</p>
                                <p class="font-mono font-bold text-brand-400 text-sm pt-1">€${p.price.toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0 space-y-3">
                            <div>
                                <label class="block text-[10px] font-mono text-gray-400 mb-1">Colore Filamento:</label>
                                <select id="color-select-${p.id}" class="w-full bg-dark-bg border border-gray-700/80 text-white rounded-xl px-3 py-2 text-xs font-mono focus:border-brand-500 focus:outline-none">
                                    ${(typeof filamentColors !== 'undefined' ? filamentColors : [{name:"Standard", code:"#10b981"}]).map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
                                </select>
                            </div>
                            <button onclick="addToCart(${p.id})" class="w-full py-3 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg">Aggiungi al Carrello</button>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function openProductModal(id) {
            const p = products.find(item => item.id === id);
            if (!p) return;
            const mainImg = p.images && p.images.length > 0 ? p.images[p.mainImageIndex || 0] : defaultImg;

            document.getElementById('modal-content').innerHTML = `
                <div class="space-y-4">
                    <img src="${mainImg}" class="w-full h-64 object-cover rounded-xl border border-gray-800">
                    <div class="flex gap-2 overflow-x-auto pb-2">
                        ${(p.images || [defaultImg]).map((img, idx) => `
                            <img src="${img}" class="w-16 h-16 object-cover rounded-lg border ${idx === (p.mainImageIndex || 0) ? 'border-brand-500' : 'border-gray-800'}">
                        `).join('')}
                    </div>
                    <h2 class="text-2xl font-bold text-white">${p.title}</h2>
                    <p class="text-brand-400 font-mono text-lg font-bold">€${p.price.toFixed(2)}</p>
                    <div class="space-y-2 pt-2 border-t border-gray-800">
                        <h4 class="text-xs font-mono text-gray-400 uppercase tracking-widest">Descrizione Dettagliata</h4>
                        <p class="text-sm text-gray-300 leading-relaxed">${p.longDesc || 'Nessuna descrizione dettagliata disponibile per questo prodotto.'}</p>
                    </div>
                </div>
            `;
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function addToCart(prodId) {
            const product = products.find(p => p.id === prodId);
            if (!product) return;
            const colorSelect = document.getElementById(`color-select-${prodId}`);
            const selectedColor = colorSelect ? colorSelect.value : "Standard";

            const existing = cart.find(item => item.id === prodId && item.color === selectedColor);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: product.id, title: product.title, price: product.price, color: selectedColor, qty: 1 });
            }
            saveCart();
            openCartModal();
        }

        function saveCart() {
            localStorage.setItem('ls3d_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            document.getElementById('cart-badge').innerText = cart.reduce((acc, i) => acc + i.qty, 0);
        }

        function openCartModal() {
            const container = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-4">Il carrello è vuoto.</p>`;
                document.getElementById('cart-total-price').innerText = "€0.00";
            } else {
                let subtotal = 0;
                container.innerHTML = cart.map((i, idx) => {
                    subtotal += i.price * i.qty;
                    return `
                        <div class="flex justify-between items-center bg-dark-bg p-3 rounded-xl border border-gray-800">
                            <div>
                                <p class="font-bold text-white">${i.qty}x ${i.title}</p>
                                <p class="text-[10px] text-gray-400">Colore: <span class="text-brand-400">${i.color}</span></p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-brand-400">€${(i.price * i.qty).toFixed(2)}</span>
                                <button onclick="removeFromCart(${idx})" class="text-red-400 hover:text-red-300">✕</button>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('cart-total-price').innerText = `€${subtotal.toFixed(2)}`;
            }
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }
        function removeFromCart(index) { cart.splice(index, 1); saveCart(); openCartModal(); }

        renderProducts();
        updateCartBadge();
    </script>
</body>
</html>
