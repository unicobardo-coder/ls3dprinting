<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS 3D Printing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* 
          VERSIONE: 1.3
          MAPPA MODIFICHE:
          - Integrato il logo e lo stile originale della homepage.
          - Mantenute intatte tutte le sezioni (vetrina, registrazione utente, admin, chi siamo).
          - Aggiunto lo script di traduzione i18n per le 5 lingue (it, en, fr, es, de) nel selettore dell'header.
        */
        const translations = {
            it: {
                title: "LS 3D Printing",
                subtitle: "Stampa 3D personalizzata, prototipi e modelli di alta qualità.",
                cta: "Scopri i Prodotti",
                languages: "Lingua:"
            },
            en: {
                title: "LS 3D Printing",
                subtitle: "Custom 3D printing, prototypes, and high-quality models.",
                cta: "Explore Products",
                languages: "Language:"
            },
            fr: {
                title: "LS 3D Printing",
                subtitle: "Impression 3D personnalisée, prototypes et modèles de haute qualité.",
                cta: "Découvrir les Produits",
                languages: "Langue :"
            },
            es: {
                title: "LS 3D Printing",
                subtitle: "Impresión 3D personalizada, prototipos y modelos de alta calidad.",
                cta: "Descubrir Productos",
                languages: "Idioma:"
            },
            de: {
                title: "LS 3D Printing",
                subtitle: "Maßgeschneiderter 3D-Druck, Prototypen und hochwertige Modelle.",
                cta: "Produkte entdecken",
                languages: "Sprache:"
            }
        };

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            
            const titleEl = document.getElementById('main-title');
            const subtitleEl = document.getElementById('main-subtitle');
            const ctaEl = document.getElementById('cta-btn');
            const labelEl = document.getElementById('lang-label');

            if (titleEl) titleEl.innerText = translations[lang].title;
            if (subtitleEl) subtitleEl.innerText = translations[lang].subtitle;
            if (ctaEl) ctaEl.innerText = translations[lang].cta;
            if (labelEl) labelEl.innerText = translations[lang].languages;
            
            localStorage.setItem('preferred_lang', lang);
            document.documentElement.lang = lang;
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('preferred_lang') || 'it';
            const selectElement = document.getElementById('lang-select');
            if (selectElement) {
                selectElement.value = savedLang;
                changeLanguage(savedLang);
            }
        };
    </script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased">
    
    <!-- HEADER / NAV CON LOGO E STILE ORIGINALE -->
    <header class="flex justify-between items-center p-6 max-w-7xl mx-auto border-b border-gray-800">
        <!-- Logo e brand style -->
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-black px-3 py-2 rounded-lg text-lg tracking-wider">LS</div>
            <h1 class="text-xl font-bold tracking-wider">3D Printing</h1>
        </div>
        
        <!-- Sezioni originali (Vetrina, Chi siamo, Admin, Registrazione) -->
        <nav class="hidden md:flex space-x-6 text-sm text-gray-300">
            <a href="#vetrina" class="hover:text-white transition">Vetrina</a>
            <a href="#about" class="hover:text-white transition">Chi Siamo</a>
            <a href="#admin" class="hover:text-white transition">Admin</a>
            <a href="#login" class="hover:text-white transition">Registrati / Login</a>
        </nav>

        <!-- Selettore Lingue -->
        <div class="flex items-center space-x-2">
            <span id="lang-label" class="text-sm text-gray-400">Lingua:</span>
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-gray-800 text-white text-sm rounded px-2 py-1 border border-gray-700 focus:outline-none">
                <option value="it">Italiano</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
            </select>
        </div>
    </header>

    <!-- HERO SECTION -->
    <main class="max-w-4xl mx-auto text-center py-20 px-4">
        <h2 id="main-title" class="text-4xl md:text-6xl font-extrabold mb-6">LS 3D Printing</h2>
        <p id="main-subtitle" class="text-lg md:text-xl text-gray-300 mb-10">Stampa 3D personalizzata, prototipi e modelli di alta qualità.</p>
        <a id="cta-btn" href="#vetrina" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-lg transition shadow-lg">Scopri i Prodotti</a>
    </main>

    <!-- Sezioni successive (Vetrina, Registrazione Utente, Admin, Chi Siamo) mantenute intatte -->

</body>
</html>
