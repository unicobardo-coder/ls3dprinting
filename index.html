<!-- SEZIONE VETRINA IN EVIDENZA -->
<section class="py-16 px-4 sm:px-6 max-w-7xl mx-auto w-full space-y-8">
    <div class="flex justify-between items-center border-b border-gray-800 pb-4">
        <div>
            <h2 class="text-2xl font-bold text-white tracking-tight">⭐ Prodotti in Vetrina</h2>
            <p class="text-xs text-gray-400 font-mono">I nostri articoli in primo piano scelti per te.</p>
        </div>
        <a href="catalog.html" class="text-xs font-mono text-brand-400 hover:underline">Vedi tutto il catalogo →</a>
    </div>

    <!-- Griglia Prodotti In Evidenza -->
    <div id="featured-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Generato via JavaScript -->
    </div>
</section>

<!-- Script per popolare la vetrina in Home -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const grid = document.getElementById('featured-products-grid');
        if (!grid) return;

        let products = [];
        try { products = JSON.parse(localStorage.getItem('ls3d_products')) || []; } catch (e) { products = []; }

        // Filtra solo i prodotti visibili e messi in evidenza (featured)
        const featuredProducts = products.filter(p => !p.hidden && p.featured);

        if (featuredProducts.length === 0) {
            grid.innerHTML = `<p class="text-gray-500 text-xs font-mono col-span-full py-6">Nessun prodotto in vetrina al momento. Aggiungine uno dal pannello Admin!</p>`;
            return;
        }

        const defaultImg = "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=80";

        grid.innerHTML = featuredProducts.map(p => {
            const mainImg = p.images && p.images.length > 0 ? p.images[p.mainImageIndex || 0] : defaultImg;
            const hasDiscount = p.salePrice && p.salePrice < p.price;
            
            const priceDisplay = hasDiscount 
                ? `<div class="flex items-center gap-2"><span class="line-through text-gray-500 text-xs">€${Number(p.price).toFixed(2)}</span><span class="font-mono font-bold text-red-400 text-sm">€${Number(p.salePrice).toFixed(2)}</span></div>`
                : `<p class="font-mono font-bold text-brand-400 text-sm">€${Number(p.price || 0).toFixed(2)}</p>`;

            const discountBadge = hasDiscount 
                ? `<span class="absolute top-2 left-2 px-2 py-0.5 rounded bg-red-500 text-white font-bold text-[10px] font-mono shadow">OFFERTA</span>` 
                : '';

            return `
                <div class="bg-dark-card border border-gray-800/80 hover:border-brand-500/40 transition-all rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between group">
                    <div>
                        <div class="relative overflow-hidden cursor-pointer" onclick="window.location.href='catalog.html'">
                            <img src="${mainImg}" alt="${p.title}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500">
                            ${discountBadge}
                        </div>
                        <div class="p-5 space-y-2">
                            <h3 class="font-bold text-white text-base">${p.title}</h3>
                            <p class="text-xs text-gray-400 leading-relaxed">${p.shortDesc || ''}</p>
                            <div class="pt-1">${priceDisplay}</div>
                        </div>
                    </div>
                    <div class="p-5 pt-0">
                        <a href="catalog.html" class="block w-full py-3 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs text-center transition-all shadow-lg">Scopri di più</a>
                    </div>
                </div>
            `;
        }).join('');
    });
</script>
