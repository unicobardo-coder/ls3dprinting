<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS3Dmaker | Stampa 3D & Prototipazione</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 600: '#059669', 400: '#34d399', 900: '#064e3b' },
                        dark: { bg: '#090d16', card: '#111827', surface: '#151e32' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-dark-card/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
               <img src="logo.png" alt="LS3Dmaker Logo" class="h-20 sm:h-24 object-contain">
            </a>

            <nav class="hidden md:flex items-center gap-6 font-medium text-sm text-gray-300">
                <a href="index.html" class="text-brand-400 font-bold">Catalogo</a>
                <a href="chisiamo.html" class="hover:text-brand-400 transition-colors">Chi Siamo</a>
                <a href="info.html" class="hover:text-brand-400 transition-colors">Richiedi Info</a>
                <a href="admin.html" class="text-xs font-mono px-3 py-1.5 rounded-lg bg-gray-800 text-brand-400 border border-gray-700 hover:border-brand-500 transition-colors">⚙️ Admin</a>
            </nav>

            <button onclick="openCartModal()" class="relative p-3 bg-dark-surface rounded-xl border border-gray-700 hover:border-brand-500 transition-colors flex items-center gap-2">
                <i data-lucide="shopping-cart" class="w-5 h-5 text-brand-400"></i>
                <span id="cart-badge" class="absolute -top-2 -right-2 bg-brand-500 text-black text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center font-mono">0</span>
            </button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="py-16 px-4 bg-gradient-to-b from-dark-card to-dark-bg border-b border-gray-800">
        <div class="max-w-4xl mx-auto text-center space-y-6">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight">Stampe 3D di Precisione & Prototipazione</h1>
            <p class="text-sm sm:text-base text-gray-400 max-w-2xl mx-auto">Scegli il tuo oggetto e personalizza il colore del filamento in base alle tue preferenze.</p>
        </div>
    </section>

    <!-- CATALOGO PRODOTTI -->
    <main class="py-12 px-4 flex-grow max-w-7xl mx-auto w-full space-y-8">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold text-white">I Nostri Prodotti</h2>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- CARRELLO MODALE -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-gray-800 w-full max-w-lg rounded-2xl p-6 space-y-6 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <h3 class="text-lg font-bold text-white">Carrello</h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            
            <div id="cart-items-container" class="space-y-4 max-h-60 overflow-y-auto font-mono text-xs"></div>

            <div class="border-t border-gray-800 pt-4 flex justify-between items-center font-bold text-sm">
                <span>Totale Carrello:</span>
                <span id="cart-total-price" class="text-brand-400">€0.00</span>
            </div>

            <div class="flex gap-3">
                <button onclick="closeCartModal()" class="flex-1 py-3 bg-gray-800 text-gray-300 rounded-xl text-xs">Continua Shopping</button>
                <a href="checkout.html" class="flex-1 py-3 bg-brand-500 text-black font-bold rounded-xl text-xs text-center flex items-center justify-center">Vai al Checkout →</a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-gray-950 border-t border-gray-800 py-8 text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <p class="font-bold text-white">LS3Dmaker © 2026</p>
            <div class="flex gap-4 font-mono">
                <a href="chisiamo.html" class="hover:underline">Chi Siamo</a>
                <a href="info.html" class="hover:underline">Richiedi Info</a>
                <a href="admin.html" class="hover:underline text-brand-400">Area Admin</a>
            </div>
        </div>
    </footer>

    <script>
        const defaultImg = "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=80";
        let products = JSON.parse(localStorage.getItem('ls3d_products')) || [
            { id: 1, title: "Fermalibri Cyber Geometry", price: 34.90, shortDesc: "Design geometrico futurista.", colors: ["Nero Opaco", "Bianco Perla"], images: [defaultImg], hidden: false }
        ];
        let cart = JSON.parse(localStorage.getItem('ls3d_cart')) || [];

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const activeProducts = products.filter(p => !p.hidden);

            if (activeProducts.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 text-xs font-mono col-span-full text-center py-8">Nessun prodotto disponibile al momento.</p>`;
                return;
            }

            grid.innerHTML = activeProducts.map(p => `
                <div class="bg-dark-card border border-gray-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between">
                    <div>
                        <img src="${p.images?.[0] || defaultImg}" alt="${p.title}" class="w-full h-48 object-cover">
                        <div class="p-5 space-y-2">
                            <h3 class="font-bold text-white text-base">${p.title}</h3>
                            <p class="text-xs text-gray-400">${p.shortDesc || ''}</p>
                            <p class="font-mono font-bold text-brand-400 text-sm">€${p.price.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 space-y-3">
                        <!-- SELETTORE COLORI DINAMICO -->
                        <div>
                            <label class="block text-[10px] font-mono text-gray-400 mb-1">Colore Filamento:</label>
                            <select id="color-select-${p.id}" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-3 py-2 text-xs font-mono focus:border-brand-500 focus:outline-none">
                                ${(p.colors || ["Standard"]).map(c => `<option value="${c}">${c}</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full py-3 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-transform hover:scale-[1.01]">Aggiungi al Carrello</button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function addToCart(prodId) {
            const product = products.find(p => p.id === prodId);
            if (!product) return;

            const colorSelect = document.getElementById(`color-select-${prodId}`);
            const selectedColor = colorSelect ? colorSelect.value : "Standard";

            const existing = cart.find(item => item.id === prodId && item.color === selectedColor);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title,
                    price: product.price,
                    color: selectedColor,
                    qty: 1
                });
            }
            saveCart();
            openCartModal();
        }

        function saveCart() {
            localStorage.setItem('ls3d_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const totalItems = cart.reduce((acc, i) => acc + i.qty, 0);
            document.getElementById('cart-badge').innerText = totalItems;
        }

        function openCartModal() {
            const container = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-4">Il carrello è vuoto.</p>`;
                document.getElementById('cart-total-price').innerText = "€0.00";
            } else {
                let subtotal = 0;
                container.innerHTML = cart.map((i, idx) => {
                    subtotal += i.price * i.qty;
                    return `
                        <div class="flex justify-between items-center bg-gray-900 p-3 rounded-xl border border-gray-800">
                            <div>
                                <p class="font-bold text-white">${i.qty}x ${i.title}</p>
                                <p class="text-[10px] text-gray-400">Colore: <span class="text-brand-400">${i.color}</span></p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-brand-400">€${(i.price * i.qty).toFixed(2)}</span>
                                <button onclick="removeFromCart(${idx})" class="text-red-400 hover:text-red-300">✕</button>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('cart-total-price').innerText = `€${subtotal.toFixed(2)}`;
            }
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            openCartModal();
        }

        renderProducts();
        updateCartBadge();
    </script>
</body>
</html>
