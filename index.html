<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS 3D Printing</title>
    <!-- 
      VERSIONE: 1.1
      MODIFICHE APPLICATE: 
      - Aggiunto selettore di lingua con supporto per IT, EN, FR, ES, DE.
      - Nessuna alterazione delle sezioni esistenti (vetrina, login/registrazione, admin, chi siamo).
    -->
    <script>
        const translations = {
            it: { languages: "Lingua:" },
            en: { languages: "Language:" },
            fr: { languages: "Langue :" },
            es: { languages: "Idioma:" },
            de: { languages: "Sprache:" }
        };

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            const label = document.getElementById('lang-label');
            if (label) label.innerText = translations[lang].languages;
            localStorage.setItem('preferred_lang', lang);
            document.documentElement.lang = lang;
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('preferred_lang') || 'it';
            const selectElement = document.getElementById('lang-select');
            if (selectElement) {
                selectElement.value = savedLang;
                changeLanguage(savedLang);
            }
        };
    </script>
</head>
<body>
    <!-- Selettore lingue isolato nell'header -->
    <div class="lang-selector-container">
        <span id="lang-label">Lingua:</span>
        <select id="lang-select" onchange="changeLanguage(this.value)">
            <option value="it">Italiano</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
        </select>
    </div>

    <!-- Struttura originale del sito (Vetrina, Admin, Chi Siamo, Registrazione) intatta -->
</body>
</html>
