<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Sicuro | LS3Dmaker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=IL_TUO_PAYPAL_CLIENT_ID&currency=EUR"></script>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); })();
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        brand: { 500: '#10b981', 400: '#34d399', 600: '#059669' },
                        dark: { bg: '#070b14', card: '#0d1322', surface: '#131c31' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-gray-800/85">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="LS3Dmaker Logo" class="h-10 sm:h-12 object-contain" onerror="this.src='logo.svg'">
            </a>
            <a href="catalog.html" class="text-xs font-mono text-gray-400 hover:text-white transition-colors">← Torna al Catalogo</a>
        </div>
    </header>

    <!-- CONTENUTO CHECKOUT -->
    <main class="py-12 px-4 sm:px-6 max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-8 flex-grow">
        
        <!-- SEZIONE DATI E PAGAMENTO -->
        <div class="bg-dark-card border border-gray-800 p-6 sm:p-8 rounded-2xl space-y-6 shadow-xl">
            <h1 class="text-xl font-bold text-white tracking-tight">Dati di Spedizione & Pagamento</h1>
            
            <div id="checkout-form" class="space-y-4 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Nome e Cognome *</label>
                    <input type="text" id="cust-name" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Email per Ricevuta/Fattura *</label>
                    <input type="email" id="cust-email" required class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-mono">Indirizzo di Spedizione *</label>
                    <textarea id="cust-address" required rows="2" placeholder="Via, n. civico, Città, CAP, Provincia" class="w-full bg-dark-bg border border-gray-700/80 rounded-xl p-3 text-white focus:border-brand-500 focus:outline-none"></textarea>
                </div>

                <!-- PULSANTI DI PAGAMENTO -->
                <div class="pt-6 space-y-4 border-t border-gray-800">
                    <label class="block text-gray-300 font-bold font-mono text-xs uppercase tracking-wider">Scegli come pagare:</label>
                    
                    <!-- PULSANTE STRIPE (COLLEGATO AL PAYMENT LINK) -->
                    <button type="button" onclick="payWithStripe()" class="w-full py-4 bg-brand-500 hover:bg-brand-400 text-black font-bold rounded-xl text-xs transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                        <i data-lucide="credit-card" class="w-4 h-4"></i> Paga con Carta (Stripe)
                    </button>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-gray-800"></div>
                        <span class="flex-shrink mx-4 text-gray-500 font-mono text-[10px]">oppure</span>
                        <div class="flex-grow border-t border-gray-800"></div>
                    </div>

                    <!-- PULSANTE PAYPAL -->
                    <div id="paypal-button-container" class="w-full"></div>
                </div>
            </div>
        </div>

        <!-- RIEPILOGO CARRELLO -->
        <div class="bg-dark-card border border-gray-800 p-6 sm:p-8 rounded-2xl space-y-6 shadow-xl h-fit">
            <h2 class="text-lg font-bold text-white tracking-tight border-b border-gray-800 pb-4">Riepilogo Ordine</h2>
            <div id="checkout-items-list" class="space-y-3 font-mono text-xs max-h-60 overflow-y-auto"></div>
            
            <div class="border-t border-gray-800 pt-4 space-y-2 font-mono text-xs">
                <div class="flex justify-between text-gray-400">
                    <span>Subtotale Prodotti:</span>
                    <span id="checkout-subtotal">€0.00</span>
                </div>
                <div class="flex justify-between text-gray-400">
                    <span>Spedizione corriere:</span>
                    <span id="checkout-shipping">€0.00</span>
                </div>
                <div class="border-t border-gray-800 pt-2 flex justify-between items-center font-bold text-sm text-white">
                    <span>Totale da Pagare:</span>
                    <span id="checkout-total" class="text-brand-400">€0.00</span>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#05080e] border-t border-gray-800/80 py-6 text-xs text-gray-500 text-center font-mono">
        LS3DMAKER © 2026 - Transazioni Protette
    </footer>

    <script src="mailer.js"></script>

    <script>
        // =========================================================================
        // INCOLLA QUI IL TUO PAYMENT LINK UFFICIALE DI STRIPE (es. https://buy.stripe.com/...)
        // =========================================================================
        const STRIPE_PAYMENT_LINK = 'https://buy.stripe.com/IL_TUO_LINK_REALE';

        let cart = [];
        try { cart = JSON.parse(localStorage.getItem('ls3d_cart')) || []; } catch (e) { cart = []; }

        function renderCheckoutSummary() {
            const container = document.getElementById('checkout-items-list');
            if (!container) return { subtotal: 0, shipping: 0, total: 0 };
            
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500">Il carrello è vuoto.</p>`;
                document.getElementById('checkout-subtotal').innerText = "€0.00";
                document.getElementById('checkout-shipping').innerText = "€0.00";
                document.getElementById('checkout-total').innerText = "€0.00";
                return { subtotal: 0, shipping: 0, total: 0 };
            }

            let subtotal = 0;
            let maxShipping = 0;

            container.innerHTML = cart.map(i => {
                const itemTotal = (Number(i.price) || 0) * (Number(i.qty) || 1);
                subtotal += itemTotal;
                const itemShipping = Number(i.shipping !== undefined ? i.shipping : 5.00);
                if (itemShipping > maxShipping) {
                    maxShipping = itemShipping;
                }

                return `
                    <div class="flex justify-between items-center bg-dark-bg p-3 rounded-xl border border-gray-800">
                        <div>
                            <p class="font-bold text-white">${i.qty}x ${i.title}</p>
                            <p class="text-[10px] text-gray-400">Colore: <span class="text-brand-400">${i.color || 'Standard'}</span></p>
                        </div>
                        <span class="font-bold text-brand-400">€${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            }).join('');

            const total = subtotal + maxShipping;
            document.getElementById('checkout-subtotal').innerText = `€${subtotal.toFixed(2)}`;
            document.getElementById('checkout-shipping').innerText = `€${maxShipping.toFixed(2)}`;
            document.getElementById('checkout-total').innerText = `€${total.toFixed(2)}`;
            return { subtotal, shipping: maxShipping, total };
        }

        function validateCustomerData() {
            const name = document.getElementById('cust-name').value.trim();
            const email = document.getElementById('cust-email').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !email || !address) {
                alert("Per favore, compila Nome, Email e Indirizzo di spedizione prima di procedere al pagamento.");
                return false;
            }
            return { name, email, address };
        }

        function payWithStripe() {
            const customer = validateCustomerData();
            if (!customer) return;

            const { total } = renderCheckoutSummary();
            if (total <= 0) { alert("Il carrello è vuoto."); return; }

            if (!STRIPE_PAYMENT_LINK || !STRIPE_PAYMENT_LINK.startsWith('http') || STRIPE_PAYMENT_LINK.includes('IL_TUO_LINK_REALE')) {
                alert("Configura correttamente il Payment Link ufficiale di Stripe nella variabile STRIPE_PAYMENT_LINK del codice.");
                return;
            }

            // Salva i dati cliente e il totale per registrarli dopo il pagamento
            localStorage.setItem('ls3d_pending_customer', JSON.stringify(customer));
            localStorage.setItem('ls3d_pending_total', total);

            // Reindirizza direttamente alla pagina ufficiale di Stripe
            window.location.href = STRIPE_PAYMENT_LINK;
        }

        function initPayPal() {
            const { total } = renderCheckoutSummary();
            if (total <= 0 || typeof paypal === 'undefined') return;

            try {
                paypal.Buttons({
                    createOrder: function(data, actions) {
                        const customer = validateCustomerData();
                        if (!customer) throw new Error("Dati cliente incompleti");
                        return actions.order.create({
                            purchase_units: [{ amount: { value: total.toFixed(2) } }]
                        });
                    },
                    onApprove: function(data, actions) {
                        return actions.order.capture().then(function(details) {
                            const customer = {
                                name: document.getElementById('cust-name').value || details.payer.name.given_name,
                                email: document.getElementById('cust-email').value || details.payer.email_address,
                                address: document.getElementById('cust-address').value || "Indirizzo PayPal"
                            };
                            finalizeOrderAndSave("PayPal", details.id, customer, total);
                        });
                    }
                }).render('#paypal-button-container');
            } catch(e) { console.error("PayPal error:", e); }
        }

        function finalizeOrderAndSave(gateway, transactionId, customer, total) {
            if (!cart || cart.length === 0) return;

            const newOrder = {
                id: "ORD-" + Date.now(),
                number: "2026/" + Math.floor(Math.random() * 1000),
                gateway: gateway,
                transactionId: transactionId,
                name: customer.name,
                email: customer.email,
                address: customer.address,
                date: new Date().toLocaleDateString('it-IT'),
                items: cart,
                total: total
            };

            let orders = [];
            try { orders = JSON.parse(localStorage.getItem('ls3d_orders')) || []; } catch (e) { orders = []; }
            orders.push(newOrder);
            localStorage.setItem('ls3d_orders', JSON.stringify(orders));

            if (typeof sendOrderConfirmationEmail === 'function') {
                sendOrderConfirmationEmail(newOrder);
            }

            localStorage.removeItem('ls3d_cart');
            localStorage.removeItem('ls3d_pending_customer');
            localStorage.removeItem('ls3d_pending_total');
            cart = [];

            alert(`Pagamento completato con successo (${gateway})! Ordine registrato e mail inviata.`);
            window.location.href = "index.html";
        }

        renderCheckoutSummary();
        initPayPal();
        try { lucide.createIcons(); } catch(e){}
    </script>
</body>
</html>
